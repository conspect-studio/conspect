[package]
name = "multiview-h3"
description = "HTTP/3 + WebTransport server on the moq-noq QUIC stack: one endpoint serves the site (any HTTP request) and MoQ (WebTransport under /moq/), with every peer-driven queue bounded (front-door slice 2, #288)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Exposes `multiview_h3::testing` (the in-memory h3 transport the `h3_request`
# fuzz target drives). Off in every shipped build.
fuzzing = []

[dependencies]
# hyperium h3 (MIT). The opt-in feature exposes the transport-implementer API
# (RequestResolver::accept_with_frame, FrameStream, poll_accept_request_stream)
# the WebTransport routing needs; pinned exactly because it is unstable API.
h3 = { version = "=0.0.8", features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
h3-datagram = "=0.0.2"
# The QUIC stack the vendored MoQ server and the front door already use
# (MIT OR Apache-2.0). `rustls` for QuicServerConfig; no crypto provider is
# selected by this crate (`ring` only for noq-proto's own initial keys, as
# multiview-frontdoor already enables it).
noq = { package = "moq-noq", version = "=1.3.5", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
# No provider selected: the caller passes a ready `rustls::ServerConfig`.
rustls = { version = "0.23", default-features = false, features = ["std"] }
web-transport-trait = "0.4.0"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
# Compile-level proof that a `WtSession` plugs into moq-net through the
# moq-tokio async->poll adapter (and the MoQ handshake test).
moq-tokio = { version = "=0.19.34", default-features = false, features = ["noq", "ring"] }
url = "2"
http-body-util = "0.1"

[lints]
workspace = true
