[package]
name = "multiview-webengine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
# Workspace-internal implementation crate; never published to crates.io
# (matches xtask / multiview-ntpsys). This lets cargo-deny's allow-wildcard-paths
# exempt the intra-workspace path deps while still denying real "*" version
# wildcards.
publish = false
description = "Web-engine resource scopes, process-tree/cgroup accounting sampler and the clip-job state model (ADR-0099, ADR-0100)."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Asserting the wire shape of the published record, in particular that an
# unknown GPU figure serializes as absent rather than zero. Already a workspace
# dependency.
serde_json = { workspace = true }
# Declared-file fixtures for the /proc and /sys walks (never the real ones) and
# for the temporary cgroup trees the delegation probe is exercised against.
# Already in the workspace graph (a dev-dependency of most crates); MIT/Apache-2.0,
# `cargo deny`-clean, no native deps.
tempfile = "3"

[lints]
workspace = true
