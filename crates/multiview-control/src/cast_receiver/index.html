<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conspect Cast</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="receiver.css">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<cast-media-player id="player"></cast-media-player>
<div id="overlay" class="overlay" data-state="idle" aria-live="polite">
  <div class="pane pane-idle">
    <div class="wordmark">Conspect</div>
    <div class="line">Ready to cast</div>
  </div>
  <div class="pane pane-busy">
    <div class="spinner"></div>
    <div class="title" id="busy-title"></div>
    <div class="line" id="busy-line">Connecting</div>
  </div>
  <div class="pane pane-error">
    <div class="wordmark small">Conspect</div>
    <div class="sentence" id="error-sentence"></div>
    <div class="code" id="error-code"></div>
  </div>
</div>
<script src="receiver.js"></script>
</body>
</html>
