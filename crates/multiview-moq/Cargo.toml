[package]
name = "multiview-moq"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
hang = "=0.21.22"
moq-net = "=0.3.21"
moq-tokio = { version = "=0.19.34", default-features = false, features = ["noq", "ring"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
