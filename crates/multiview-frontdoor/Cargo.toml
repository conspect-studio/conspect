[package]
name = "multiview-frontdoor"
description = "The network front door: one dual-stack UDP socket shared by QUIC (MoQ) and WebRTC, an RFC 9443 first-byte dispatcher with bounded state, on its own Tokio runtime (ADR-0107)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The shared socket, the dispatcher and the lanes run on the front door's OWN
# multi-thread runtime (never the program runtime that drives the output clock).
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# Dual-stack bind (`IPV6_V6ONLY=false`) and the SO_RCVBUF request; std cannot set
# either. Already in the graph (MIT OR Apache-2.0).
socket2 = { version = "0.6", features = ["all"] }
# The QUIC stack the vendored MoQ server already uses (moq-noq 1.3.5, MIT OR
# Apache-2.0, pure Rust + `ring`, which is in the default graph already). Used for
# `UdpSocketState` (recvmmsg/GRO receive, GSO send, PKTINFO) and the
# `AsyncUdpSocket`/`UdpSender` seam the QUIC lane implements. No TLS here.
noq = { package = "moq-noq", version = "=1.3.5", default-features = false, features = ["runtime-tokio", "ring"] }
# Bounded LRU for the per-source new-flow buckets (MIT OR Apache-2.0, in Cargo.lock).
hashlink = "0.11"
tracing = { workspace = true }
# The WebRTC lane adapter (str0m driver). Off by default: `native` links str0m
# and aws-lc; the default build of this crate stays free of native deps.
multiview-webrtc = { workspace = true, optional = true }

# `SO_ATTACH_REUSEPORT_CBPF` (validated-flow steering) and `SO_RCVBUFFORCE`:
# two `setsockopt` calls that neither std nor socket2 expose. Already in
# Cargo.lock (MIT OR Apache-2.0); used only in `src/sys.rs`, Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[features]
default = []
webrtc = ["dep:multiview-webrtc", "multiview-webrtc/native"]

[dev-dependencies]
proptest = "1.11.0"
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
# The chaos test drives the REAL engine tick loop (EngineRuntime + RealtimePacer)
# on a program runtime while the front door is flooded. Pure-Rust crates.
multiview-engine = { workspace = true }
multiview-compositor = { workspace = true }
multiview-framestore = { workspace = true }
multiview-core = { workspace = true }
# The one-socket integration test (feature `webrtc`): a real MoQ/WebTransport
# session through the vendored server with the QUIC lane injected.
moq-tokio = { version = "=0.19.34", default-features = false, features = ["noq", "ring"] }
url = "2"
anyhow = "1"

# FFI exception (as crates/multiview-ntpsys): the workspace forbids
# `unsafe_code`, and a `forbid` cannot be relaxed by an inner attribute, so this
# crate restates the workspace lint set verbatim with the single change of
# `unsafe_code` from `forbid` to `deny`. The only `unsafe` is in `src/sys.rs`
# (two `setsockopt` calls), each block `#[allow(unsafe_code)]` with a
# `// SAFETY:` note. Keep in sync with the root Cargo.toml `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all      = { level = "deny",  priority = -2 }
pedantic = { level = "warn",  priority = -1 }
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
unreachable      = "deny"
get_unwrap       = "deny"
indexing_slicing = "deny"
as_conversions   = "deny"
exit             = "deny"
mem_forget       = "deny"
dbg_macro        = "deny"
print_stdout     = "deny"
print_stderr     = "deny"
str_to_string    = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
