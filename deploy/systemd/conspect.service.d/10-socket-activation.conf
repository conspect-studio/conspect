# deploy/systemd/conspect.service.d/10-socket-activation.conf
#
# Drop-in for an existing conspect.service (mda001): start the engine with the
# sockets of conspect.socket (TCP 443, TCP 80, UDP 443 x2) as LISTEN_FDS, and
# keep them across `systemctl restart conspect` (ADR-0107 section 9, #292).
# Removing this file (and disabling conspect.socket) is the rollback.
#
# Install:  sudo install -D -m 644 deploy/systemd/conspect.service.d/10-socket-activation.conf \
#               /etc/systemd/system/conspect.service.d/10-socket-activation.conf
[Unit]
Requires=conspect.socket
After=conspect.socket
