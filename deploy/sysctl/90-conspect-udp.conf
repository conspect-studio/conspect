# Raise the UDP receive-buffer ceiling for the network front door (ADR-0107).
#
# Without CAP_NET_ADMIN the engine's SO_RCVBUFFORCE attempt fails and it
# falls back to plain SO_RCVBUF, which the kernel clamps to net.core.rmem_max
# (the front door warns at startup when this happens:
# docs/runbooks/udp-443-flood.md). 8 MiB matches the design's
# network.udp.recv_buffer_bytes default and the ReceiveBuffer=8M target that
# arrives with socket activation in slice 6
# (deploy/systemd/conspect.socket) — until then, this sysctl is the knob
# that actually widens the usable buffer.
#
# Install: copy to /etc/sysctl.d/90-conspect-udp.conf, then
#   sudo sysctl --system
# or reboot. Verify: sysctl net.core.rmem_max (expect >= 8388608).
net.core.rmem_max = 8388608
