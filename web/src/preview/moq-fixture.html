<!doctype html><html lang="en"><head><title>MoQ interoperability fixture</title></head><body><canvas id="video"></canvas><script type="module">
import { Origin, Path } from '@moq/net';
import { Player } from '@moq/watch';
import { connectMoq } from './moqConnection.ts';
const query = new URLSearchParams(location.search);
const origin = new Origin.Producer();
window.fixture = { frames: 0, timestamps: [], version: null, error: null };
// Test-only page: explicit certificate hash; production player never accepts this parameter.
try {
const session = await connectMoq(new URL('https://localhost:4443'), AbortSignal.timeout(10000), origin,
 {serverCertificateHashes: [{value: query.get('hash')}]});
window.fixture.version = session.version;
const player = new Player({origin, name: Path.from('fixture'), canvas: document.querySelector('canvas'),
 enabled:true, announced:false, muted:true, paused:false, visible:'always'});
window.fixture.close = () => {player.close(); session.close(); origin.close();};
const original = CanvasRenderingContext2D.prototype.drawImage;
CanvasRenderingContext2D.prototype.drawImage = function(image, ...args) {
 if (image instanceof VideoFrame) {window.fixture.frames++; window.fixture.timestamps.push(image.timestamp);}
 return original.call(this, image, ...args);
};
} catch (error) {window.fixture.error = String(error);}
</script></body></html>
