[package]
name = "conspect-native-exchange-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
conspect-media-crypto = { path = "../media-crypto" }
bytes = "1"
hang = "=0.21.22"
moq-net = "=0.3.21"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
