[package]
name = "conspect-moq-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
multiview-moq = { path = "../../crates/multiview-moq" }
anyhow = "1"
serde_json = "1"
url = "2"
bytes = "1"
hang = "=0.21.22"
moq-net = "=0.3.21"
moq-tokio = { version = "=0.19.34", default-features = false, features = ["noq", "ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

[profile.dev]
debug = 0
incremental = false
