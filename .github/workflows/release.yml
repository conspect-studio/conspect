name: release

# Build the `multiview` binary for each supported target on a version tag,
# tar.gz + sha256 each artifact, attest provenance, and attach them to the
# GitHub Release.
#
# We build linux `ffmpeg,linux-vaapi` (the LGPL-clean default + the platform HW
# backend) against OUR pinned FFmpeg (ADR-0031) and ship the pinned libav*
# shared libraries next to the binary (dynamic linkage; the pinned
# --enable-version3 build is LGPL-3.0-or-later and its licence texts ship in
# licenses/ffmpeg/; the binary finds the libraries via an $ORIGIN-relative
# RUNPATH). The GPL `gpl-codecs` build is
# NOT a release artifact.
#
# macOS is deliberately NOT in the matrix yet. It must link a pinned LGPL
# FFmpeg (a VideoToolbox/AudioToolbox profile for deploy/ffmpeg-build.sh is
# the next change); Homebrew's `ffmpeg` is GPL (x264/x265) and a different
# major, so it must NEVER feed a release artifact. The codesign + notarize
# steps below stay, gated on runner.os, for when the macOS legs return.

on:
  push:
    tags:
      # SemVer release tags, including pre-releases (e.g. v1.2.3, v1.2.3-rc.1).
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    # Per-target release build: pinned FFmpeg source build + a `--release
    # --locked` cargo build, plus (macOS) codesign + notarytool --wait, which can
    # block on Apple's notarization service. 60min covers a cold cache + a slow
    # notarization round-trip while still capping a wedged runner well under 6h.
    timeout-minutes: 60
    permissions:
      contents: write # attach assets to the Release
      id-token: write # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: ffmpeg,linux-vaapi
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ffmpeg,linux-vaapi
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1 # matches ci.yml + rust-toolchain.toml (channel = 1.99.1)
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.0 # v2.8.0
        with:
          key: ${{ matrix.target }}

      # ---------------------------------------------------------------------
      # FFmpeg 9.0.2 — OUR pinned, LGPL-clean build (ADR-0031), never a distro
      # package. The binding is `ffmpeg-sys-next 9.0.1` (libavcodec 63); Ubuntu
      # apt ships an older major. Build from the GPG- AND SHA-256-verified
      # source through the same deploy/ffmpeg-build.sh the images use, then
      # ASSERT the soname. The prefix is bundled into the archive below.
      # ---------------------------------------------------------------------
      - name: Build pinned FFmpeg 9.0.2
        env:
          FF_PREFIX: /opt/multiview-ffmpeg
          FF_LICENSE: lgpl
          FF_HWACCEL: vaapi
        run: |
          set -euo pipefail
          # deploy/Dockerfile.ffmpeg is the single source of truth for the pin.
          pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
          FFMPEG_VERSION="$(pin FFMPEG_VERSION)"; FFMPEG_SHA256="$(pin FFMPEG_SHA256)"
          FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)"
          export FFMPEG_VERSION FFMPEG_SHA256 FFMPEG_GIT_COMMIT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang nasm build-essential xz-utils gnupg dirmngr patchelf patch \
            libopus-dev libsrt-openssl-dev libgnutls28-dev libdrm-dev libva-dev zlib1g-dev
          case "$(uname -m)" in
            x86_64)
              sudo apt-get install -y --no-install-recommends libvpl-dev
              export TARGETARCH=amd64 ;;
            aarch64) export TARGETARCH=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          sudo -E bash deploy/ffmpeg-build.sh
          MODVER="$(PKG_CONFIG_PATH="${FF_PREFIX}/lib/pkgconfig" pkg-config --modversion libavcodec)"
          echo "libavcodec modversion: ${MODVER}"
          case "${MODVER}" in
            63.*) echo "FFmpeg 9.0.x confirmed (libavcodec ${MODVER})." ;;
            *) echo "::error::Expected libavcodec 63.x (FFmpeg 9.0.x), got ${MODVER}"; exit 1 ;;
          esac
          {
            echo "FF_PREFIX=${FF_PREFIX}"
            echo "PKG_CONFIG_PATH=${FF_PREFIX}/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          cargo build --release --locked \
            -p multiview-cli \
            --target ${{ matrix.target }} \
            --features ${{ matrix.features }}

      # ---------------------------------------------------------------------
      # macOS code-sign + notarize, GATED on the signing secrets being present.
      # Required repo/org secrets (skip cleanly if any are absent):
      #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PWD  password for that .p12
      #   AC_API_KEY_ID          App Store Connect API key id
      #   AC_API_ISSUER_ID       App Store Connect issuer id
      #   AC_API_KEY_P8          contents of the AuthKey_*.p8 (private key)
      # ---------------------------------------------------------------------
      - name: Detect signing secrets
        if: runner.os == 'macOS'
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          if [ -n "${MACOS_CERTIFICATE:-}" ] && [ -n "${AC_API_KEY_P8:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets absent; shipping an unsigned binary."
          fi

      - name: Import signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@v7 # v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Codesign + notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/multiview"
          # Hardened-runtime codesign with a secure timestamp. The signing
          # identity is the first Developer ID Application in the keychain.
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          codesign --force --options runtime --timestamp --sign "${IDENTITY}" "${BIN}"
          codesign --verify --strict --verbose=2 "${BIN}"
          # Notarize: notarytool wants an archive; zip the signed binary.
          KEYFILE="$(mktemp)"
          printf '%s' "${AC_API_KEY_P8}" > "${KEYFILE}"
          ZIP="$(mktemp -d)/multiview.zip"
          /usr/bin/ditto -c -k --keepParent "${BIN}" "${ZIP}"
          xcrun notarytool submit "${ZIP}" \
            --key "${KEYFILE}" \
            --key-id "${AC_API_KEY_ID}" \
            --issuer "${AC_API_ISSUER_ID}" \
            --wait
          rm -f "${KEYFILE}"
          # CLI binaries can't be stapled (no bundle); the notarization ticket is
          # served by Apple and checked online at first run.

      - name: Package tar.gz + sha256
        id: package
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/multiview"
          STAGE="multiview-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "${BIN}" "dist/${STAGE}/multiview"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # Ship the pinned LGPL libav* next to the binary (dynamic linkage,
            # THIRD-PARTY-NOTICES §1) and point the binary at them with an
            # $ORIGIN-relative RUNPATH, so the archive runs on a stock host
            # without LD_LIBRARY_PATH. The remaining deps are ordinary distro
            # packages, listed for users in RUNTIME-DEPENDENCIES.txt below.
            mkdir -p "dist/${STAGE}/lib" "dist/${STAGE}/licenses"
            cp -a "${FF_PREFIX}/share/licenses/ffmpeg" "dist/${STAGE}/licenses/ffmpeg"
            test -s "dist/${STAGE}/licenses/ffmpeg/COPYING.LGPLv3"
            test -s "dist/${STAGE}/licenses/ffmpeg/COPYING.GPLv3"
            cp -a "${FF_PREFIX}"/lib/lib{avcodec,avdevice,avfilter,avformat,avutil,swresample,swscale}.so.* "dist/${STAGE}/lib/"
            patchelf --set-rpath '$ORIGIN/lib' "dist/${STAGE}/multiview"
            # Prove the bundle resolves with NO loader override: every libav*
            # must come from the archive's own lib/, and nothing may be missing.
            out="$(env -u LD_LIBRARY_PATH ldd "dist/${STAGE}/multiview")"
            printf '%s\n' "${out}"
            if printf '%s\n' "${out}" | grep -q 'not found'; then
              echo "::error::release binary has unresolved libraries"; exit 1
            fi
            {
              echo "multiview ${{ github.ref_name }} (${{ matrix.target }}) - host runtime packages"
              echo "The pinned FFmpeg libraries are bundled in lib/. Install these on Debian 13 / Ubuntu 24.04:"
              echo "  sudo apt-get install libgnutls30t64 libopus0 libsrt1.5-openssl libva2 libva-drm2 libdrm2 zlib1g"
              echo "  (older releases name the first package libgnutls30)"
              if [ "$(uname -m)" = x86_64 ]; then
                echo "  sudo apt-get install libvpl2   # Intel QSV (oneVPL) on amd64"
              fi
              echo "Then check: ldd ./multiview | grep 'not found' (no output means ready)."
            } > "dist/${STAGE}/RUNTIME-DEPENDENCIES.txt"
            for so in libavcodec.so.63 libavformat.so.63 libavutil.so.61; do
              printf '%s\n' "${out}" | grep -q "${so} => .*/dist/${STAGE}/lib/${so}" \
                || { echo "::error::${so} does not resolve from the bundled lib/"; exit 1; }
            done
          fi
          # Legal files are mandatory: a missing one fails the release.
          cp README.md LICENSE LICENSE-COMMERCIAL.md NOTICE THIRD-PARTY-NOTICES.md "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          ( cd dist && shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256" )
          echo "archive=dist/${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${STAGE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.1 # v4 (4.1.0)
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3.0.1 # v2 (2.4.1)
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
