name: release

# Build the `multiview` binary for each supported target on a version tag,
# tar.gz + sha256 each artifact, attest provenance, and attach them to the
# GitHub Release.
#
# We build linux `ffmpeg,linux-vaapi` (the LGPL-clean default + the platform HW
# backend) against OUR pinned FFmpeg (ADR-0031) and ship the pinned libav*
# shared libraries next to the binary (dynamic linkage; the pinned
# --enable-version3 build is LGPL-3.0-or-later and its licence texts ship in
# licenses/ffmpeg/; the binary finds the libraries via an $ORIGIN-relative
# RUNPATH). The GPL `gpl-codecs` build is
# NOT a release artifact.
#
# macOS (Apple silicon) builds the `apple` preset against OUR pinned LGPL
# FFmpeg (FF_HWACCEL=apple: VideoToolbox/AudioToolbox). Homebrew provides only
# LGPL/permissive build deps (opus, srt, gnutls); Homebrew's `ffmpeg` (GPL) is
# never installed here. deploy/macos-bundle.sh copies the libav* dylibs and
# their deps into lib/ with @rpath install names, collects their upstream
# licence texts, and signs inside-out (Developer ID + hardened runtime when the
# signing secrets exist, ad-hoc otherwise); the archive is then notarized.

on:
  push:
    tags:
      # SemVer release tags, including pre-releases (e.g. v1.2.3, v1.2.3-rc.1).
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    # Per-target release build: pinned FFmpeg source build + a `--release
    # --locked` cargo build, plus (macOS) codesign + notarytool --wait, which can
    # block on Apple's notarization service. 60min covers a cold cache + a slow
    # notarization round-trip while still capping a wedged runner well under 6h.
    timeout-minutes: 60
    permissions:
      contents: write # attach assets to the Release
      id-token: write # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            features: ffmpeg,linux-vaapi
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ffmpeg,linux-vaapi
          - os: macos-15
            target: aarch64-apple-darwin
            features: apple
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1 # matches ci.yml + rust-toolchain.toml (channel = 1.99.1)
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.8.0 # v2.8.0
        with:
          key: ${{ matrix.target }}

      # ---------------------------------------------------------------------
      # FFmpeg 9.0.2 — OUR pinned, LGPL-clean build (ADR-0031), never a distro
      # package. The binding is `ffmpeg-sys-next 9.0.1` (libavcodec 63); Ubuntu
      # apt ships an older major. Build from the GPG- AND SHA-256-verified
      # source through the same deploy/ffmpeg-build.sh the images use, then
      # ASSERT the soname. The prefix is bundled into the archive below.
      # ---------------------------------------------------------------------
      - name: Build pinned FFmpeg 9.0.2
        if: runner.os == 'Linux'
        env:
          FF_PREFIX: /opt/multiview-ffmpeg
          FF_LICENSE: lgpl
          FF_HWACCEL: vaapi
        run: |
          set -euo pipefail
          # deploy/Dockerfile.ffmpeg is the single source of truth for the pin.
          pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
          FFMPEG_VERSION="$(pin FFMPEG_VERSION)"; FFMPEG_SHA256="$(pin FFMPEG_SHA256)"
          FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)"
          export FFMPEG_VERSION FFMPEG_SHA256 FFMPEG_GIT_COMMIT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang nasm build-essential xz-utils gnupg dirmngr patchelf patch \
            libopus-dev libsrt-openssl-dev libgnutls28-dev libdrm-dev libva-dev zlib1g-dev
          case "$(uname -m)" in
            x86_64)
              sudo apt-get install -y --no-install-recommends libvpl-dev
              export TARGETARCH=amd64 ;;
            aarch64) export TARGETARCH=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          sudo -E bash deploy/ffmpeg-build.sh
          MODVER="$(PKG_CONFIG_PATH="${FF_PREFIX}/lib/pkgconfig" pkg-config --modversion libavcodec)"
          echo "libavcodec modversion: ${MODVER}"
          case "${MODVER}" in
            63.*) echo "FFmpeg 9.0.x confirmed (libavcodec ${MODVER})." ;;
            *) echo "::error::Expected libavcodec 63.x (FFmpeg 9.0.x), got ${MODVER}"; exit 1 ;;
          esac
          {
            echo "FF_PREFIX=${FF_PREFIX}"
            echo "PKG_CONFIG_PATH=${FF_PREFIX}/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Build pinned FFmpeg 9.0.2 (apple profile)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
          FFMPEG_VERSION="$(pin FFMPEG_VERSION)"; FFMPEG_SHA256="$(pin FFMPEG_SHA256)"
          FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)"
          export FFMPEG_VERSION FFMPEG_SHA256 FFMPEG_GIT_COMMIT
          FF_PREFIX="${RUNNER_TEMP}/multiview-ffmpeg"
          # LGPL/permissive build deps only. Never Homebrew's GPL `ffmpeg`.
          brew install pkg-config nasm opus srt gnutls
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          FF_PREFIX="${FF_PREFIX}" FF_LICENSE=lgpl FF_HWACCEL=apple TARGETARCH=arm64 \
            bash deploy/ffmpeg-build.sh
          if "${FF_PREFIX}/bin/ffmpeg" -hide_banner -buildconf | grep -qE 'enable-gpl|enable-nonfree|libx26[45]'; then
            echo "::error::macOS FFmpeg prefix is not LGPL-only"; exit 1
          fi
          test -e "${FF_PREFIX}/lib/libavcodec.63.dylib"
          {
            echo "FF_PREFIX=${FF_PREFIX}"
            echo "PKG_CONFIG_PATH=${FF_PREFIX}/lib/pkgconfig"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          cargo build --release --locked \
            -p multiview-cli \
            --target ${{ matrix.target }} \
            --features ${{ matrix.features }}

      # ---------------------------------------------------------------------
      # macOS code-sign + notarize, GATED on the signing secrets being present.
      # Required repo/org secrets (skip cleanly if any are absent):
      #   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
      #   MACOS_CERTIFICATE_PWD  password for that .p12
      #   AC_API_KEY_ID          App Store Connect API key id
      #   AC_API_ISSUER_ID       App Store Connect issuer id
      #   AC_API_KEY_P8          contents of the AuthKey_*.p8 (private key)
      # ---------------------------------------------------------------------
      - name: Detect signing secrets
        if: runner.os == 'macOS'
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set=0
          for v in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD AC_API_KEY_ID AC_API_ISSUER_ID AC_API_KEY_P8; do
            [ -n "${!v:-}" ] && set=$((set + 1))
          done
          if [ "${set}" = 5 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${set}" = 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets absent; shipping an ad-hoc signed, un-notarized binary."
          else
            echo "::error::macOS signing secrets are partly configured (${set}/5); set all five or none."
            exit 1
          fi

      - name: Import signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Package tar.gz + sha256
        id: package
        shell: bash
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/multiview"
          STAGE="multiview-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "${BIN}" "dist/${STAGE}/multiview"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            # Self-contained bundle: libav* + deps in lib/ (@rpath), their
            # licence texts in licenses/, signed inside-out.
            mkdir -p "dist/${STAGE}/licenses"
            cp -a "${FF_PREFIX}/share/licenses/ffmpeg" "dist/${STAGE}/licenses/ffmpeg"
            test -s "dist/${STAGE}/licenses/ffmpeg/COPYING.LGPLv3"
            case "${SIGNING_ENABLED}" in
              true | false) ;;
              *) echo "::error::signing state unknown ('${SIGNING_ENABLED}')"; exit 1 ;;
            esac
            IDENTITY="-"
            if [ "${SIGNING_ENABLED}" = "true" ]; then
              # Exactly one Developer ID Application identity, by its hash
              # (bash 3.2 on the runner: no mapfile).
              ids=()
              while IFS= read -r id; do
                [ -n "${id}" ] && ids+=("${id}")
              done < <(security find-identity -v -p codesigning | awk '/Developer ID Application/ {print $2}')
              if [ "${#ids[@]}" -ne 1 ]; then
                echo "::error::expected one Developer ID Application identity, found ${#ids[@]}"; exit 1
              fi
              IDENTITY="${ids[0]}"
            fi
            env -u DYLD_LIBRARY_PATH bash deploy/macos-bundle.sh "dist/${STAGE}" "${IDENTITY}"
            for lib in libavcodec.63.dylib libavformat.63.dylib libavutil.61.dylib; do
              test -e "dist/${STAGE}/lib/${lib}" || { echo "::error::${lib} not bundled"; exit 1; }
            done
          fi
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # Ship the pinned LGPL libav* next to the binary (dynamic linkage,
            # THIRD-PARTY-NOTICES §1) and point the binary at them with an
            # $ORIGIN-relative RUNPATH, so the archive runs on a stock host
            # without LD_LIBRARY_PATH. The remaining deps are ordinary distro
            # packages, listed for users in RUNTIME-DEPENDENCIES.txt below.
            mkdir -p "dist/${STAGE}/lib" "dist/${STAGE}/licenses"
            cp -a "${FF_PREFIX}/share/licenses/ffmpeg" "dist/${STAGE}/licenses/ffmpeg"
            test -s "dist/${STAGE}/licenses/ffmpeg/COPYING.LGPLv3"
            test -s "dist/${STAGE}/licenses/ffmpeg/COPYING.GPLv3"
            cp -a "${FF_PREFIX}"/lib/lib{avcodec,avdevice,avfilter,avformat,avutil,swresample,swscale}.so.* "dist/${STAGE}/lib/"
            patchelf --set-rpath '$ORIGIN/lib' "dist/${STAGE}/multiview"
            # Prove the bundle resolves with NO loader override: every libav*
            # must come from the archive's own lib/, and nothing may be missing.
            out="$(env -u LD_LIBRARY_PATH ldd "dist/${STAGE}/multiview")"
            printf '%s\n' "${out}"
            if printf '%s\n' "${out}" | grep -q 'not found'; then
              echo "::error::release binary has unresolved libraries"; exit 1
            fi
            {
              echo "multiview ${{ github.ref_name }} (${{ matrix.target }}) - host runtime packages"
              echo "The pinned FFmpeg libraries are bundled in lib/. Install these on Debian 13 / Ubuntu 24.04:"
              echo "  sudo apt-get install libgnutls30t64 libopus0 libsrt1.5-openssl libva2 libva-drm2 libdrm2 zlib1g"
              echo "  (older releases name the first package libgnutls30)"
              if [ "$(uname -m)" = x86_64 ]; then
                echo "  sudo apt-get install libvpl2   # Intel QSV (oneVPL) on amd64"
              fi
              echo "Then check: ldd ./multiview | grep 'not found' (no output means ready)."
            } > "dist/${STAGE}/RUNTIME-DEPENDENCIES.txt"
            for so in libavcodec.so.63 libavformat.so.63 libavutil.so.61; do
              printf '%s\n' "${out}" | grep -q "${so} => .*/dist/${STAGE}/lib/${so}" \
                || { echo "::error::${so} does not resolve from the bundled lib/"; exit 1; }
            done
          fi
          if [ "${RUNNER_OS}" = "macOS" ]; then
            {
              echo "multiview ${{ github.ref_name }} (${{ matrix.target }}) - macOS notes"
              echo "Libraries: lib/ holds the bundled LGPL libav* and their dependencies, dynamically linked."
              echo "To use your own build of one, overwrite lib/<same file name> with a signed dylib"
              echo "(ad-hoc is enough: codesign --force --sign - lib/<name>). DYLD_* variables are ignored."
              echo "First run: a downloaded, quarantined binary is checked online against its notarization"
              echo "ticket (a command-line binary cannot be stapled). Without network access, run"
              echo "  xattr -dr com.apple.quarantine ./multiview-*"
              echo "after verifying the archive's sha256."
            } > "dist/${STAGE}/MACOS-NOTES.txt"
          fi
          # Legal files are mandatory: a missing one fails the release.
          cp README.md LICENSE LICENSE-COMMERCIAL.md NOTICE THIRD-PARTY-NOTICES.md "dist/${STAGE}/"
          if [ "${RUNNER_OS}" = "macOS" ] && [ "${SIGNING_ENABLED}" = "true" ]; then
            # Notarize the finished tree (everything that ships), and require
            # an Accepted verdict before anything is published.
            # The API key lives only in a private temp dir removed on any exit.
            WORK="$(umask 077; mktemp -d)"
            trap 'rm -rf "${WORK}"' EXIT
            ( umask 077; printf '%s' "${AC_API_KEY_P8}" > "${WORK}/AuthKey.p8" )
            /usr/bin/ditto -c -k --keepParent "dist/${STAGE}" "${WORK}/multiview.zip"
            if ! RESULT="$(xcrun notarytool submit "${WORK}/multiview.zip" \
              --key "${WORK}/AuthKey.p8" \
              --key-id "${AC_API_KEY_ID}" \
              --issuer "${AC_API_ISSUER_ID}" \
              --wait --timeout 30m --output-format json 2> "${WORK}/submit.err")"; then
              if [ -z "${RESULT}" ]; then
                echo "::error::notarytool submit failed before a submission existed:"
                cat "${WORK}/submit.err"
                exit 1
              fi
            fi
            json_field() { python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get(sys.argv[1], ""))' "$1" 2>/dev/null || true; }
            STATUS="$(printf '%s' "${RESULT}" | json_field status)"
            SUBMISSION="$(printf '%s' "${RESULT}" | json_field id)"
            echo "notarization: status=${STATUS:-unknown} id=${SUBMISSION:-none}"
            if [ "${STATUS}" != "Accepted" ]; then
              [ -n "${SUBMISSION}" ] && xcrun notarytool log "${SUBMISSION}" \
                --key "${WORK}/AuthKey.p8" --key-id "${AC_API_KEY_ID}" --issuer "${AC_API_ISSUER_ID}" || true
              echo "::error::notarization was not Accepted"; exit 1
            fi
            # CLI binaries can't be stapled (no bundle); the ticket is served by
            # Apple and checked online at first run.
          fi
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
          ( cd dist && shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256" )
          echo "archive=dist/${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/${STAGE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        run: |
          # import-codesign-certs creates signing_temp.keychain; delete it so the
          # certificate is not usable by any later step.
          # The action's own post step also removes it; this is the backstop.
          if security list-keychains | grep -q signing_temp.keychain; then
            security delete-keychain signing_temp.keychain \
              || echo "::warning::could not delete signing_temp.keychain"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.1.1 # v4 (4.1.0)
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
