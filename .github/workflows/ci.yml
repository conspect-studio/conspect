name: CI

on:
  push:
    branches: [main]
    paths: &run_paths
      - '**'
      - '!FEATURES.md'
      - '!ROADMAP.md'
      - '!WHY.md'
      - '!docs/**/*.md'
      - 'docs/api/**'
      - 'docs/agents/**'
      - 'docs/licensing/**'
      - 'docs/standards/**'
      - 'docs/**/AGENTS.md'
      - 'docs/**/CLAUDE.md'
  pull_request:
    paths: *run_paths

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # paths-filter reads the PR diff via the API on pull_request events.
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── change classification (CI efficiency, ADR-0046) ──────────────────────────
  # Classify the PR diff as "code" (anything that can affect build/test/lint or a
  # generated spec) vs "docs-only" (a STRICT prose allowlist). The heavy matrix
  # below is gated on `code == 'true'`; a docs-only PR skips it and only the
  # always-run light jobs (inclusive-language, docs-sanity) report green.
  #
  # SAFETY: this can only ever SKIP work for a PR whose entire diff is prose docs
  # that cannot influence the build/test/lint/spec surface. The `code` filter is
  # built to FAIL SAFE — it matches `**` (every changed file) and then negates
  # ONLY the strict prose allowlist, under `predicate-quantifier: every`. The
  # documented effect (see dorny/paths-filter README) is: a changed file makes
  # `code` true unless it matches one of the prose negations. Therefore ANY file
  # type we did not explicitly allowlist as prose (a new extension, a dotfile, a
  # config, a lockfile, a spec under docs/api/**, anything under web/ .github/
  # xtask/ deploy/ crates/) → `code = true` → the FULL matrix runs. "When in
  # doubt, run everything" is the default, not the exception.
  #
  # Event-level paths omit pure planning/prose changes before Actions queues a run.
  # For admitted pushes to main, run the full matrix. For admitted PRs, keep
  # the existing broader job-level classification; see ADR-0046.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    # Single checkout + paths-filter API call (~30s). Fail fast if a runner wedges.
    timeout-minutes: 10
    outputs:
      # 'true' when at least one changed file is NOT in the prose allowlist.
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Default `some` would treat the leading `!` negations as ordinary
          # match patterns; `every` makes a file count for `code` only when it
          # matches `**` AND none of the prose negations — i.e. it is non-prose.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              # ─── Prose allowlist (negations) — files that CANNOT affect the
              # build/test/lint/spec surface. Every negation is scoped narrowly:
              # docs/api/** (the generated OpenAPI/AsyncAPI specs) is NEVER
              # excluded, and same-extension files that ARE build/test inputs
              # (proptest-regressions *.txt, bundled crate assets/font licences,
              # web/ images) stay `code`. When in doubt the file stays `code`.
              # Verified empirically against all tracked files: the only files
              # classified docs-only are .md / .txt / images / LICENSE* / NOTICE
              # outside docs/api/** (see ADR-0046 truth table).
              #
              # Markdown prose. docs/!(api)/** excludes the docs tree EXCEPT the
              # docs/api spec dir, so docs/api/*.md prose pages stay `code` (the
              # task treats all of docs/api/** as code). No *.md is embedded via
              # include_str!/bytes! anywhere in this repo (verified).
              - '!docs/!(api)/**/*.md'
              - '!docs/*.md'
              - '!*.md'
              - '!crates/**/*.md'
              - '!web/**/*.md'
              - '!examples/**/*.md'
              - '!.github/**/*.md'
              # Plain-text docs + licence/notice in the docs tree (NOT docs/api/)
              # or at the repo root. Crate/test *.txt (proptest regressions,
              # bundled font OFL.txt) deliberately stay `code`.
              - '!docs/!(api)/**/*.txt'
              - '!docs/*.txt'
              - '!*.txt'
              - '!LICENSE'
              - '!LICENSE-COMMERCIAL'
              - '!NOTICE'
              - '!docs/**/LICENSE*'
              - '!docs/**/NOTICE'
              # Documentation images in the docs tree (NOT docs/api/) or at the
              # repo root. Crate/web asset images stay `code` (compiled-in or
              # part of the SPA build).
              - '!docs/!(api)/**/*.png'
              - '!docs/!(api)/**/*.jpg'
              - '!docs/!(api)/**/*.jpeg'
              - '!docs/!(api)/**/*.gif'
              - '!docs/!(api)/**/*.svg'
              - '!docs/!(api)/**/*.webp'
              - '!docs/*.png'
              - '!docs/*.jpg'
              - '!docs/*.jpeg'
              - '!docs/*.gif'
              - '!docs/*.svg'
              - '!docs/*.webp'
              - '!*.png'
              - '!*.jpg'
              - '!*.jpeg'
              - '!*.gif'
              - '!*.svg'
              - '!*.webp'
              # docs/api/** (openapi.json/asyncapi.json + the *.md spec pages) is
              # excluded nowhere above → matches `**`, fails no negation →
              # `code = true` → spec validation runs. (asyncapi.json is also
              # include_str!'d into the multiview-control binary.)

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # fmt + clippy run ~1-2min warm; a cold cargo cache pushes the full clippy
    # build higher. 20min is ~3x worst-case while still well under the 6h default.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        # --locked enforces the committed Cargo.lock — cargo ignores the lockfile
        # without it — so the lint build is deterministic.
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  capture-browser:
    name: required real-browser capture HTTP
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: provision required capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx --yes --package=playwright@1.58.2 playwright install --with-deps chromium
          echo "CONSPECT_WEB_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "CONSPECT_WEB_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)
          test -n "$browser"
          echo "CONSPECT_WEB_BROWSER=$browser" >> "$GITHUB_ENV"
      # Disposable Ubuntu runner only: permit Chromium to create its user namespace.
      # Chromium's own sandbox stays enabled; never add --no-sandbox to the producer.
      - name: allow sandboxed browser user namespace on the disposable runner
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          timeout 20 "$CONSPECT_WEB_BROWSER" --headless --disable-dev-shm-usage --dump-dom about:blank
          "$CONSPECT_WEB_FFMPEG" -hide_banner -version
      - name: require real browser HTTP test with positive count
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p multiview-control --features capture-browser-integration --test web_capture_tcp actual_browser_http_post_commits_decodable_artifact -- --exact 2>&1 | tee capture-browser-proof.log
          grep -F 'test result: ok. 1 passed; 0 failed;' capture-browser-proof.log

  test:
    name: check + test (${{ matrix.os }})
    # The long pole of CI: macOS check+test runs ~15min warm (the slowest leg);
    # a cold cargo cache on macOS is materially slower. 40min gives the macOS leg
    # generous headroom while still failing a wedged runner far under 6h. ubuntu
    # (~7min) shares the same cap with ample margin.
    timeout-minutes: 40
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The ubuntu runner has ~14 GiB free; the workspace test binaries plus the
      # sqlite-feature rebuilds below exhausted it (ENOSPC in the runner, an `ld`
      # SIGBUS mid-link, #381). Drop preinstalled toolchains this job never uses.
      - name: free runner disk (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # Default features are pure-Rust (no FFmpeg/GPU), so CI needs no native libs.
      # --locked enforces the committed Cargo.lock — cargo ignores the lockfile
      # without it — so check + test are deterministic.
      - name: cargo check
        run: cargo check --locked --workspace
      - name: cargo test
        # Skip the compositor per-tick perf BUDGET test on shared CI runners: it
        # asserts a wall-clock ceiling only meaningful on consistent hardware
        # (ADR-E009 — perf gates run on dedicated runners). The tile-driven
        # SCALING correctness is covered unconditionally by
        # tile_driven_scales_with_coverage_not_tile_count.
        run: cargo test --locked --workspace -- --skip tile_driven_meets_budget
      - name: test multiview-control --features sqlite (desired-state projection)
        # The default build carries no SQLite (its licence is outside the
        # cargo-deny allowlist), so the layouts.db projection never ran in CI.
        # Scoped to the desired-state tests: the injected SQLite fault after an
        # envelope commit (layout_projection_fault), the first commit continuing
        # a SQLite layout version (desired_first_commit_versions), and the
        # repository itself (sqlite_repo). Ubuntu only: the code is
        # platform-neutral and the macOS leg is already the long pole.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: >
          cargo test
          --locked
          -p multiview-control
          --features sqlite
          --test layout_projection_fault
          --test desired_first_commit_versions
          --test layout_durable
          --test desired_all_collections
          --test source_output_durable
          --test boot_config_model
          --test sqlite_repo
      - name: test multiview-cli --features sqlite (boot migration + rebind)
        # The real boot path over a real layouts.db: first-boot migration of an
        # active.toml + layouts.db install with no desired.json, layout rebind,
        # identical restarts, stale If-Match, and a corrupt desired.json stopping
        # the real binary. Name no test filter here: a trailing filter applies
        # to every --test target and would silently run zero tests in them.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 15
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features sqlite
          --test desired_migration
          --test boot_resume
      - name: test multiview-cli --features sqlite (bind_and_serve restore)
        # The `control` module lib tests under the same feature: restoring
        # accepted names and versions through bind_and_serve. A separate step
        # because its `control::` filter must not reach the targets above.
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features sqlite
          --lib control::

  # ── feature-gated clippy + test matrix (IN-7) ────────────────────────────────
  # The default `lint` and `test` jobs run with default features only (pure-Rust,
  # no native deps). These off-by-default features are compile-verified here so
  # their type-check and lint coverage matches the default build.
  #
  # Feature → crate mapping:
  #   multiview-input:   st2110  (UDP/RTP depacketizer seam, tokio::net only)
  #                      webrtc  (SDP model + transport shell, pure Rust)
  #                      youtube (yt-dlp resolver + info-dict parser)
  #   multiview-engine:  ptp     (PHC discipline read, rustix/clock_gettime)
  #                      cluster (HA wire transport, serde_json)
  #                      ntp     (adjtimex read via multiview-ntpsys FFI leaf)
  #   multiview-control: is07-mqtt (MQTT transport for IS-07 tally, rumqttc)
  #                      nmos    (NMOS IS-04/05/08 discovery + receiver bind)
  #                      devices-net (live Cast driver + mDNS discovery)
  #   multiview-hal:     i915-pmu (Intel perf_event_open PMU, multiview-i915pmu)
  #
  # NDI (IN-3) is NOT a Cargo feature yet: the grafton-ndi link requires the
  # proprietary SDK fetched at build time (ADR-0008). It lives in a separate
  # Docker lane that fetches the SDK under NDA; that lane is not modelled here.
  #
  # `cargo deny check` intentionally stays on default features only (see `deny`
  # job below) — enabling these features would pull rumqttc/rustix into the
  # license scan, all of which are already in deny.toml's allow-list, but
  # --all-features would also surface gpl-codecs and ndi which are not.
  feature-clippy:
    name: feature-gated clippy (${{ matrix.crate }}, ${{ matrix.feature }})
    runs-on: ubuntu-latest
    # Each leg clippy+tests one crate under one feature (~1min warm). A cold,
    # per-feature-scoped cargo cache can take several minutes; 20min is safe.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # multiview-input off-by-default features
          - crate: multiview-input
            feature: st2110
          - crate: multiview-input
            feature: webrtc
          - crate: multiview-input
            feature: youtube
          # multiview-engine off-by-default features
          - crate: multiview-engine
            feature: ptp
          - crate: multiview-engine
            feature: cluster
          - crate: multiview-engine
            feature: ntp
          # multiview-control off-by-default features
          - crate: multiview-control
            feature: is07-mqtt
          - crate: multiview-control
            feature: nmos
          # The live Cast driver + mDNS discovery (ADR-M011, ADR-0111):
          # `devices-net` = zowietek + cast (CASTV2 TLS + protobuf framing) +
          # discovery (mdns-sd). Pure Rust, no device needed: the cast tests
          # (`cast_net`, `cast_session_streams`, …) run over loopback [::1] and
          # a scripted channel. The default jobs build none of `cast::net`.
          - crate: multiview-control
            feature: devices-net
          # multiview-control + multiview-cli off-by-default `tls` feature (TLS-0,
          # ADR-W029): static-certificate rustls termination on the control
          # listener. The default `lint`/`test` jobs build NEITHER the
          # `serve_router_tls`/`load_tls_material` path NOR the `tls_serve` e2e
          # (it is `required-features = ["tls"]`), so without these legs the TLS
          # code would ship CI-untested. Pure Rust at the CI level — rustls +
          # aws-lc-rs is a CPU C build (cc + cmake, already built on this bare
          # runner by the `multiview-webrtc`/`native` leg below), no hardware/NIC.
          # The `multiview-control` leg's `cargo test --features tls` runs the
          # `tls_serve` end-to-end (rcgen self-signed → real reqwest HTTPS →
          # per-IP 200-then-429), pinning the SEC-14 ConnectInfo preservation
          # under TLS (ADR-W028). The `multiview-cli` leg gates the serve-vs-
          # serve_tls selection + the feature-off `[control.tls]` rejection path.
          - crate: multiview-control
            feature: tls
          - crate: multiview-cli
            feature: tls
          # The front-door ACME engine (slice 5, #291): clippy + the egress,
          # Cloudflare-fake and output-clock cadence tests (`acme_*`, in-process
          # on [::1]); the Pebble flows are #[ignore]d here and run in the
          # dedicated `acme-pebble` job below.
          - crate: multiview-control
            feature: acme
          # Slice 5 PR B: the ACME boot wiring, `multiview tls` CLI and the
          # dead-CA boot test (`tests/tls_cli.rs`: the realtime software clock
          # keeps 50/50 ticks while the CA refuses).
          - crate: multiview-cli
            feature: acme
          # multiview-hal off-by-default features
          - crate: multiview-hal
            feature: i915-pmu
          # multiview-hal + multiview-cli `vaapi`/`qsv`: the AMD/Intel DRM sysfs +
          # /proc fdinfo per-GPU load source (`SysfsLoadPoller`, ADR-0017 ENG-4b)
          # and its `default_load_source` wiring. Pure `std::fs` — no native
          # VAAPI/QSV lib at compile time — so it lints + tests on the bare
          # runner. The default `lint`/`test` jobs build NONE of the `linux_sysfs`
          # module (it is `#[cfg(any(vaapi, qsv))]`), so without this leg the
          # poller ships un-clippy'd under its own feature. `vaapi` exercises the
          # shared `any(vaapi, qsv)` code (qsv is symmetric).
          - crate: multiview-hal
            feature: vaapi
          - crate: multiview-cli
            feature: vaapi
          # multiview-licence off-by-default feature: the Conspect device
          # heartbeat client (CONSPECT-3 / ADR-0096). Pure Rust — p256 + base64 +
          # hex + tokio, no native deps — so it lints + tests on the bare runner.
          # This is the key-trust verifier + the signed-lease verifier + the
          # HeartbeatClient loop + the fake-server tests (incl. the live well-known
          # golden vectors); the default `lint`/`test` jobs build none of it.
          - crate: multiview-licence
            feature: heartbeat
          # multiview-cli off-by-default feature: the heartbeat wiring +
          # the live reqwest/rustls transport + the never-off-air chaos gate that
          # SIGKILLs/stalls/partitions the heartbeat task against the output clock.
          # `heartbeat` does NOT imply the cli `ffmpeg` feature (reqwest is pure
          # rustls, no libav), so it lints + tests on the bare runner alongside the
          # default `software` feature.
          - crate: multiview-cli
            feature: heartbeat
          # Overlay text engine (cosmic-text + swash + etagere atlas + bundled OFL
          # fonts; ADR-R007/ADR-E002). Pure Rust — GPU-free and links NO ffmpeg —
          # so it lints + tests on the bare runner. The default `lint`/`test` jobs
          # build NONE of this: a cosmic-text 0.19 `set_text` signature break
          # reached main (the text.rs render path lives in `multiview-compositor`
          # under `--features overlay`) because no gate built the overlay feature
          # (PR #203). These legs gate that surface going forward.
          #
          # The text rasterizer + the GPU overlay sub-pass live in
          # `multiview-compositor`'s `overlay` feature — this is the leg that
          # actually compiles the cosmic-text `Buffer`/`FontSystem` call sites.
          - crate: multiview-compositor
            feature: overlay
          # The wgpu compositor backend (the DEFAULT GPU backend; ADR-E002, §F inv#5).
          # Pure Rust at COMPILE time — wgpu/naga/wgpu-hal build GPU-free — and every
          # wgpu-gated test (tests/gpu_*.rs, backend_select.rs) matches
          # `Error::NoAdapter`/`DeviceRequest` and SKIPS when no adapter is present
          # (the real-GPU parity checks carry `#[ignore]`), so this leg lints + tests
          # on the bare runner. The default `lint`/`test` jobs build NONE of the
          # `gpu/` module: a wgpu 30 API drift (`RequestAdapterOptions.apply_limit_buckets`
          # + fallible `get_mapped_range`) sat red on main unnoticed (#55) because no
          # gate built `--features wgpu`. This leg gates that surface going forward
          # (same rationale as the `overlay` legs above).
          - crate: multiview-compositor
            feature: wgpu
          # The `multiview-cli` umbrella `overlay` feature gates
          # `multiview-compositor/overlay` (it does NOT imply `ffmpeg` — it is the
          # GPU-free, LGPL-clean overlay tier the `nvidia`/`apple`/`linux-vaapi`/
          # `full` presets all pull in), plus the cli's own overlay wiring + tests.
          - crate: multiview-cli
            feature: overlay
          # NOTE: `multiview-overlay --features libass` is gated by a SEPARATE
          # job (`feature-clippy-overlay-libass`) below — its own cargo cache
          # graph — but that job now runs BOTH clippy AND `cargo test`, the same
          # as this matrix's legs (the `subtitle` capability test is cfg-gated by
          # feature, #141, so the suite is green under `--features libass`).
          # WebRTC native egress/ingest (str0m + aws-lc-rs). The default `lint`
          # and `test` jobs build none of these, so the wave-1 union (#141↔#147)
          # broke `webrtc-native` silently on main; this leg gates it going
          # forward. multiview-webrtc owns the Session/egress API (the
          # method-name break that silently hit main lived here) and is pure
          # str0m — it links NO ffmpeg, so it runs on the bare runner.
          #
          # NOTE: the `multiview-cli` (`webrtc-native`) build links ffmpeg —
          # `webrtc-native` implies the cli `ffmpeg` feature (the WHIP ingest
          # decode + WHEP encode ride the libav path), so `ffmpeg-sys-next`'s
          # build.rs probes pkg-config for libav* and the build fails on this
          # ffmpeg-free runner. (The paired `multiview-preview --features webrtc`
          # is itself pure-Rust — it links NO ffmpeg — but its lint coverage rides
          # the same ffmpeg-equipped leg as the cli for one cohesive webrtc gate.)
          # Guarding the ffmpeg-linked cli surface needs the pinned FFmpeg base
          # image (ghcr.io/<owner>/multiview-ffmpeg:9.0.2-lgpl, libavcodec .so.63) —
          # that is the dedicated `feature-clippy-ffmpeg-webrtc` job below. The
          # crate leg here already guards the pure-str0m Session/egress API
          # surface that broke.
          - crate: multiview-webrtc
            feature: native
          # The front door's one-socket MoQ + WebRTC tests (ADR-0107, #287).
          - crate: multiview-frontdoor
            feature: webrtc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Scope the cache per feature so entries don't collide across matrix legs.
          key: feature-${{ matrix.crate }}-${{ matrix.feature }}
      - name: clippy (${{ matrix.feature }})
        # --locked: enforce the committed Cargo.lock for a deterministic build
        # (cargo ignores it otherwise). --all-targets: also lints integration-test binaries under
        # the feature. -D warnings: matches the default `lint` job gate.
        # Hardware/network live paths are gated in the tests themselves via
        # #[ignore] or cfg_attr(not(feature=...), ignore), so this never needs
        # a real NIC, PTP device, MQTT broker, or NDI sender.
        run: >
          cargo clippy
          --locked
          -p ${{ matrix.crate }}
          --features ${{ matrix.feature }}
          --all-targets
          -- -D warnings
      - name: test (${{ matrix.feature }})
        # cargo test --no-fail-fast: surface all failures, not just the first.
        # Hardware-gated tests carry #[ignore] and are excluded from shared CI.
        # NOT VERIFIED ANYWHERE TODAY: no self-hosted or GPU-tagged runner exists
        # in this repository (every `runs-on:` is a GitHub-hosted ubuntu/macos
        # image), and no nightly workflow exists. ADR-E009/ADR-0022 describe a
        # dedicated-runner tier that has not been built, so these tests and the
        # SSIM/PSNR parity assertions currently never execute. Do not describe
        # them as gated.
        #
        # --skip tile_driven_meets_budget: the compositor per-tick perf BUDGET
        # test asserts a wall-clock ceiling only meaningful on consistent
        # hardware (ADR-E009/ADR-0022), so
        # it is flaky on shared CI. The default `test` job skips it for the same
        # reason; mirror that here for the `multiview-compositor`/`overlay` leg
        # (it lives only in that crate, so the flag is a no-op for every other
        # leg). The tile-driven SCALING correctness stays covered unconditionally
        # by tile_driven_scales_with_coverage_not_tile_count.
        run: >
          cargo test
          --locked
          -p ${{ matrix.crate }}
          --features ${{ matrix.feature }}
          -- --skip tile_driven_meets_budget

  # ── multiview-overlay libass clippy + test (closes a #134/#141 gap) ──────────
  # `multiview-overlay`'s off-by-default `libass` capability gate (the ASS/SSA
  # subtitle burn-in seam, ADR-R007/R008) has zero coverage in the default
  # `lint`/`test` jobs. It gets its OWN job (rather than a slot in the shared
  # `feature-clippy` clippy+test matrix) only because its cargo-cache graph is
  # scoped separately; it now runs BOTH clippy AND `cargo test` like every
  # matrix leg. Previously this was clippy-only because the crate's `subtitle`
  # test asserted the libass-OFF fallback (`AssCapability::detect() ==
  # Unavailable`) UNCONDITIONALLY, so `cargo test --features libass` was red by
  # design. That test is now cfg-gated by feature (#141) — the libass-OFF
  # assertion runs only without the feature and the libass-ON dual asserts
  # `Available` — so the test suite is green under `--features libass` and we
  # gain real run-time coverage of the libass-gated path. The crate is pure Rust
  # here (the native libass/HarfBuzz/FriBidi toolchain is wired downstream), so
  # both steps run on the bare runner.
  acme-pebble:
    name: ACME flows against Pebble (#291)
    runs-on: ubuntu-latest
    # Target < 10 min warm: download + verify Pebble, one feature build, ~1 min of flows.
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    env:
      PEBBLE_VERSION: v2.10.3
      PEBBLE_WORK: ${{ github.workspace }}/.pebble
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: acme-pebble
      - name: download and verify Pebble + challtestsrv
        run: |
          set -euo pipefail
          mkdir -p "$PEBBLE_WORK/test/certs/localhost"
          cd "$PEBBLE_WORK"
          base="https://github.com/letsencrypt/pebble/releases/download/$PEBBLE_VERSION"
          curl -fsSLO "$base/pebble-linux-amd64.tar.gz"
          curl -fsSLO "$base/pebble-challtestsrv-linux-amd64.tar.gz"
          raw="https://raw.githubusercontent.com/letsencrypt/pebble/$PEBBLE_VERSION"
          curl -fsSL -o test/certs/pebble.minica.pem "$raw/test/certs/pebble.minica.pem"
          curl -fsSL -o test/certs/localhost/cert.pem "$raw/test/certs/localhost/cert.pem"
          curl -fsSL -o test/certs/localhost/key.pem "$raw/test/certs/localhost/key.pem"
          cat > SHA256SUMS <<'SUMS'
          7e33cf3e426b67e9e647c44e8cc91683caa8ab331f7a99e5e27fcee291c4c7e2  pebble-linux-amd64.tar.gz
          00b2c5ef525cd8ad56cda898a7cac6169a10b0fd3f2a7456fe0cec92e7b36cb6  pebble-challtestsrv-linux-amd64.tar.gz
          0c502e52627ff7de972c7e9e065640103b4589b4e2d23d3fcf21bef1e3c8c67c  test/certs/pebble.minica.pem
          c87fb918d9bac8db11aa54493b5f0cf6e0725a3fe73f617d1c64737e1ab4caf9  test/certs/localhost/cert.pem
          0977979255b0e0721c17335c056b627f66a43cf56e5a52f3cda81fb111ecf00e  test/certs/localhost/key.pem
          SUMS
          sed -i 's/^ *//' SHA256SUMS
          sha256sum -c SHA256SUMS
          tar -xzf pebble-linux-amd64.tar.gz
          tar -xzf pebble-challtestsrv-linux-amd64.tar.gz
          # The release tarballs do not carry the exec bit.
          chmod +x pebble-linux-amd64/linux/amd64/pebble pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv
          echo "PEBBLE_BIN=$PEBBLE_WORK/pebble-linux-amd64/linux/amd64/pebble" >> "$GITHUB_ENV"
          echo "CHALLTESTSRV_BIN=$PEBBLE_WORK/pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv" >> "$GITHUB_ENV"
      - name: build the ACME tests
        run: cargo test --locked -p multiview-control --features acme --test acme_pebble --no-run
      - name: start Pebble (standard, EAB, nonce-reject) + challtestsrv
        run: |
          ci/pebble/run-local.sh start
          cat "$PEBBLE_WORK/pebble.env" >> "$GITHUB_ENV"
      - name: test (acme_pebble)
        run: cargo test --locked -p multiview-control --features acme --test acme_pebble -- --ignored --test-threads=1
      - name: Pebble logs
        if: failure()
        run: tail -n 200 "$PEBBLE_WORK"/*.log || true
      - name: stop Pebble
        if: always()
        run: ci/pebble/run-local.sh stop

  feature-clippy-overlay-libass:
    name: feature-gated clippy + test (multiview-overlay, libass)
    runs-on: ubuntu-latest
    # A single crate clippy + test under one feature (~1min warm); a cold
    # per-feature cargo cache can take a few minutes. 20min matches the
    # `feature-clippy` legs.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: feature-multiview-overlay-libass
      - name: clippy (libass)
        # --locked enforces the committed Cargo.lock — cargo ignores it otherwise. --all-targets also
        # lints the test binaries under the feature; -D warnings matches the
        # default `lint` gate.
        run: >
          cargo clippy
          --locked
          -p multiview-overlay
          --features libass
          --all-targets
          -- -D warnings
      - name: test (libass)
        # Now that the `subtitle` capability test is cfg-gated by feature (#141),
        # the suite is green under `--features libass`, so run it for real run-time
        # coverage of the libass-gated path. --locked mirrors CI determinism —
        # cargo ignores the lockfile without it. The crate has no perf-budget test, so no
        # `--skip tile_driven_meets_budget` is needed here.
        run: >
          cargo test
          --locked
          -p multiview-overlay
          --features libass

  # ── ffmpeg-linked webrtc-native clippy (closes the #154 follow-up gap) ───────
  # The `feature-clippy` matrix above runs on a libav-FREE runner, so it cannot
  # clippy the targets whose feature pulls ffmpeg. `multiview-cli`'s
  # `webrtc-native` feature implies the cli `ffmpeg` feature (WHIP ingest decode
  # + WHEP encode ride the libav path), and `multiview-preview`'s `webrtc` seam
  # is the paired preview surface — neither is covered by the default `lint`
  # clippy (default features only) NOR by the libav-free `feature-clippy` matrix.
  # That is exactly the gap that let the wave-1 webrtc-native break (ADR-0049 /
  # ADR-0060 cli wiring: a `too_many_lines` + a `double_must_use`) reach main
  # silently: a `cargo build` never runs those clippy lints, and no clippy leg
  # built these features.
  #
  # This leg clippies them against the SAME pinned FFmpeg the deploy images link:
  # ghcr.io/<owner>/multiview-ffmpeg:9.0.2-lgpl (libavcodec .so.63 — the soname
  # `ffmpeg-sys-next 9.0.1` binds, NOT ubuntu apt's 6.x/so.60, which would
  # generate the WRONG bindings). That base image is `FROM scratch` (it ships
  # ONLY /opt/multiview-ffmpeg — no shell/apt, so it cannot be a job `container:`),
  # so we pull it and `docker cp` /opt/multiview-ffmpeg out onto the runner, then
  # point pkg-config + the loader at it — the identical mechanism deploy/Dockerfile
  # uses (`COPY --from=ffmpeg /opt/multiview-ffmpeg` + PKG_CONFIG_PATH, ADR-0031).
  avc-metadata-native-gpl:
    name: AVC metadata native GPL encoder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
      packages: read
    env:
      FFMPEG_TAG: 9.0.2-gpl
      FFMPEG_PREFIX: /opt/multiview-ffmpeg
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: avc-metadata-native-gpl
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the published pinned GPL FFmpeg image
        run: |
          set -euo pipefail
          image="$(scripts/resolve-ffmpeg-image.sh "${{ github.repository_owner }}" "${FFMPEG_TAG}")"
          docker pull "${image}"
          cid="$(docker create "${image}" /nonexistent)"
          trap 'docker rm "${cid}" >/dev/null' EXIT
          sudo mkdir -p "$(dirname "${FFMPEG_PREFIX}")"
          sudo docker cp "${cid}:${FFMPEG_PREFIX}" "${FFMPEG_PREFIX}"
      - name: Run actual encoder metadata in the matching Trixie runtime
        # The GPL prefix is built on Debian Trixie, not the Ubuntu runner ABI.
        # Use the same pinned Debian base as deploy/Dockerfile.ffmpeg. Mount the
        # selected Rust toolchain and cache, but resolve native libraries here.
        run: |
          set -euo pipefail
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          "${toolchain_bin}/rustc" -vV
          "${toolchain_bin}/cargo" --version
          docker run --rm -i \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$HOME/.cargo:/cargo" -v "$HOME/.rustup:/rustup:ro" \
            -v "${FFMPEG_PREFIX}:${FFMPEG_PREFIX}:ro" \
            -e CARGO_HOME=/cargo -e RUSTUP_HOME=/rustup \
            -v "$(dirname "${toolchain_bin}"):/selected-rust:ro" \
            -e PATH=/selected-rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e FFMPEG_PREFIX="${FFMPEG_PREFIX}" \
            debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6 \
            bash -s <<'TRIXIE'
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates build-essential pkg-config clang libclang-dev nasm \
            libva2 libva-drm2 libopus0 libsrt1.5-openssl libvpl2 libx264-dev libx265-dev \
            libnuma1 libdrm2 libgnutls30t64
          export PKG_CONFIG_PATH="${FFMPEG_PREFIX}/lib/pkgconfig"
          export LD_LIBRARY_PATH="${FFMPEG_PREFIX}/lib"
          version="$(pkg-config --modversion libavcodec)"
          case "${version}" in 63.*) ;; *) echo "::error::Expected pinned libavcodec 63.x (FFmpeg 9.0.2)"; exit 1 ;; esac
          for library in "${FFMPEG_PREFIX}"/lib/lib*.so; do
            dependencies="$(ldd "${library}")" || { echo "::error::ldd failed"; exit 1; }
            if grep -q 'not found' <<< "${dependencies}"; then
              echo "::error::Pinned GPL image runtime dependency mismatch"
              exit 1
            fi
          done
          cargo test --locked -p multiview-ffmpeg --features ffmpeg,gpl-codecs --lib \
            codec_metadata::tests::native_libx264_encoder_emission_yields_actual_decoder_metadata -- --exact \
            2>&1 | tee native-avc-metadata.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed;' native-avc-metadata.log
          TRIXIE

  feature-clippy-ffmpeg-webrtc:
    name: ffmpeg-linked webrtc clippy
    runs-on: ubuntu-latest
    # Pull the base image + a per-feature-scoped clippy build (str0m + aws-lc-rs
    # + ffmpeg-sys bindgen from cold). A cold cargo cache pushes this into the
    # several-minute range; 30min is generous headroom while capping a wedge.
    timeout-minutes: 45  # +15 covers the one-off FFmpeg source bootstrap (see extract step)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
      # docker pull from GHCR needs a token to read the (private) base package.
      packages: read
    env:
      # The pinned, LGPL-clean FFmpeg 9.0.2 base (libavcodec .so.63) — the same
      # image the docker app build COPYs /opt/multiview-ffmpeg from (ADR-0031 §5).
      # Only the TAG is fixed here; the extract step resolves the image via
      # scripts/resolve-ffmpeg-image.sh: this owner's ghcr.io/<owner>/multiview-ffmpeg
      # (published by ffmpeg-base.yml) when that tag exists, else the public
      # upstream ghcr.io/aperim/multiview-ffmpeg (before the owner's first publish).
      FFMPEG_TAG: 9.0.2-lgpl
      # Where we extract /opt/multiview-ffmpeg to on the runner. pkg-config + the
      # dynamic loader are pointed here so ffmpeg-sys-next's build.rs discovers
      # FFmpeg 9.0.2 (detects ffmpeg_9_0 → libavcodec 63) and the link finds .so.63.
      FFMPEG_PREFIX: /opt/multiview-ffmpeg
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key — this leg's graph (ffmpeg-sys + str0m + aws-lc-rs)
          # differs from every libav-free `feature-clippy` leg.
          key: feature-clippy-ffmpeg-webrtc
      - name: Log in to GHCR
        # The base image package is read via the workflow token (packages: read).
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install bindgen toolchain + VAAPI runtime
        # ffmpeg-sys-next's build.rs runs bindgen (needs clang/libclang) and the
        # libav build wants nasm present; pkg-config locates our prefix's .pc.
        # Installed BEFORE the extract step so the modversion assertion below has
        # a guaranteed pkg-config (the ubuntu image ships one, but don't rely on it).
        #
        # The RUNTIME libs the pinned LGPL FFmpeg 9.0.2 links (per
        # deploy/ffmpeg-build.sh: --enable-vaapi/--enable-libdrm, --enable-libopus,
        # --enable-libsrt [gnutls], --enable-libvpl): an ffmpeg-linked TEST binary
        # (the aes67 leg below) fails to LOAD with exit 127 without them on the bare
        # runner; clippy never loads the binary, so it did not need them. Mapping
        # soname -> ubuntu-noble package:
        #   libva.so.2 / libva-drm.so.2 -> libva2 / libva-drm2  (VAAPI)
        #   libopus.so.0                -> libopus0
        #   libsrt.so.1.5               -> libsrt1.5-openssl     (the image builds against libsrt-openssl-dev, whose SONAME is libsrt.so.1.5; the gnutls flavour ships libsrt-gnutls.so.1.5)
        #   libvpl.so.2                 -> libvpl2               (oneVPL)
        # gnutls + libdrm are preinstalled on ubuntu-latest; NO x264/x265 (GPL-gated,
        # absent from the -lgpl build). The `ldd` completeness guard below fails fast
        # if this list ever drifts, naming the exact missing soname.
        #
        # `ffmpeg` is the distro CLI, a fixture generator only: the audio lib
        # tests shell out to it for lavfi clips, which the pinned
        # --disable-everything build cannot make. Nothing links it. The wrapper on
        # PATH runs it with LD_LIBRARY_PATH cleared so the pinned libraries
        # (no lavfi) can never be loaded into it, whatever sonames the distro
        # and the pinned build carry; the test binaries still load the pinned
        # libraries.
        #   `ffmpeg` (the CLI) too: the `srt-libsrt` leg below drives real SRT
        #   caller/listener peers through it (push_resilient_srt.rs /
        #   push_pipeline.rs's srt_listener_* tests), independent of the pinned
        #   libav* this leg links into the Rust test binary.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev nasm \
            libva2 libva-drm2 libopus0 libsrt1.5-openssl libvpl2 \
            ffmpeg
          shim="${RUNNER_TEMP}/fixture-bin"
          mkdir -p "${shim}"
          printf '#!/bin/sh\nexec env -u LD_LIBRARY_PATH /usr/bin/ffmpeg "$@"\n' > "${shim}/ffmpeg"
          chmod 0755 "${shim}/ffmpeg"
          echo "${shim}" >> "$GITHUB_PATH"
      - name: Extract pinned FFmpeg 9.0.2 from the base image
        # The base is `FROM scratch` (only /opt/multiview-ffmpeg), so we create a
        # (never-run) container from it and `docker cp` the prefix out — the same
        # libav* tree deploy/Dockerfile pulls via `COPY --from=ffmpeg`.
        #
        # Bootstrap: a change that bumps FFMPEG_TAG lands together with the new
        # base pin, and ffmpeg-base.yml only publishes that tag after merge. When
        # neither the owner nor the upstream image carries the tag yet, build the
        # SAME pinned source with the SAME script instead (its own GPG + SHA-256
        # verification and soname assertion apply), so the PR is still checked
        # against the exact FFmpeg it pins. Every later run pulls the image.
        run: |
          set -euo pipefail
          FFMPEG_IMAGE="$(scripts/resolve-ffmpeg-image.sh "${{ github.repository_owner }}" "${FFMPEG_TAG}")"
          if docker pull "${FFMPEG_IMAGE}"; then
            # `docker create` on a `FROM scratch` image with no CMD/ENTRYPOINT fails
            # with "no command specified"; pass a dummy argv so the create succeeds.
            # It is NEVER executed — `docker cp` only reads the container's rootfs,
            # which already holds /opt/multiview-ffmpeg from the image layer.
            cid="$(docker create "${FFMPEG_IMAGE}" /nonexistent)"
            sudo mkdir -p "$(dirname "${FFMPEG_PREFIX}")"
            # Copy the whole prefix ({lib,include,lib/pkgconfig}) to its canonical
            # location so the .pc files' absolute prefix= paths resolve unchanged.
            sudo docker cp "${cid}:${FFMPEG_PREFIX}" "${FFMPEG_PREFIX}"
            docker rm "${cid}" >/dev/null
          else
            echo "::warning::${FFMPEG_IMAGE} is not published yet; building the pinned FFmpeg from source (bootstrap)."
            sudo apt-get install -y --no-install-recommends \
              build-essential xz-utils gnupg dirmngr patch \
              libopus-dev libsrt-openssl-dev libgnutls28-dev libdrm-dev libva-dev libvpl-dev zlib1g-dev
            pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
            sudo env FF_PREFIX="${FFMPEG_PREFIX}" FF_LICENSE=lgpl FF_HWACCEL=vaapi TARGETARCH=amd64 \
              FFMPEG_VERSION="$(pin FFMPEG_VERSION)" FFMPEG_SHA256="$(pin FFMPEG_SHA256)" \
              FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)" \
              bash deploy/ffmpeg-build.sh
          fi
          # Sanity: the extracted prefix must actually carry the .pc + the .so.
          test -f "${FFMPEG_PREFIX}/lib/pkgconfig/libavcodec.pc" \
            || { echo "::error::libavcodec.pc missing under ${FFMPEG_PREFIX}"; exit 1; }
          # Assert we got the soname the binding targets (FFmpeg 9.0.x →
          # libavcodec 63.x). A wrong major here would compile the wrong cfg and
          # link the wrong .so — fail loudly rather than silently mis-bind.
          MODVER="$(PKG_CONFIG_PATH="${FFMPEG_PREFIX}/lib/pkgconfig" pkg-config --modversion libavcodec)"
          echo "libavcodec modversion: ${MODVER}"
          case "${MODVER}" in
            63.*) echo "FFmpeg 9.0.x confirmed (libavcodec ${MODVER})." ;;
            *) echo "::error::Expected libavcodec 63.x (FFmpeg 9.0.x), got ${MODVER}"; exit 1 ;;
          esac
          # Export the discovery env for the clippy steps (build.rs probes these).
          {
            echo "PKG_CONFIG_PATH=${FFMPEG_PREFIX}/lib/pkgconfig"
            echo "LD_LIBRARY_PATH=${FFMPEG_PREFIX}/lib"
          } >> "$GITHUB_ENV"
      - name: clippy multiview-cli --features webrtc-native
        # The ffmpeg-linked target the libav-free matrix cannot build. --locked
        # enforces the committed Cargo.lock — cargo ignores it otherwise; -D warnings matches the
        # default `lint` gate; --all-targets also lints test binaries.
        run: >
          cargo clippy
          --locked
          -p multiview-cli
          --features webrtc-native
          --all-targets
          -- -D warnings
      - name: clippy multiview-cli --features overlay,webrtc-native
        # The overlay × webrtc-native cross-feature pair (#137): both gate code in
        # `multiview-cli`, and `webrtc-native` implies `ffmpeg`, so this combo can
        # only build on this ffmpeg-equipped leg — not on the libav-free
        # `feature-clippy` matrix. A `cargo build` of the binary never runs these
        # clippy lints, and no leg built the pair, so a non-exhaustive `match` over
        # `SourceLocation` (the overlay-gated `resolve_incontainer_sub_route`
        # missing the webrtc-native `Webrtc` arm) slipped through (fixed in PR #202).
        # This step gates the pair going forward. --locked enforces the committed
        # Cargo.lock — cargo ignores it otherwise.
        run: >
          cargo clippy
          --locked
          -p multiview-cli
          --features overlay,webrtc-native
          --all-targets
          -- -D warnings
      - name: clippy multiview-preview --features webrtc
        # The paired preview WHEP seam. Built here alongside the cli target so the
        # whole webrtc-native surface is clippy-gated in one ffmpeg-equipped leg.
        # --locked enforces the committed Cargo.lock — cargo ignores it otherwise.
        run: >
          cargo clippy
          --locked
          -p multiview-preview
          --features webrtc
          --all-targets
          -- -D warnings
      - name: clippy multiview-cli --features ffmpeg,aes67
        # AES67 / SMPTE ST 2110-30 raw-PCM audio wiring (#96 / #103). The CLI RX
        # (`drive_aes67_rx`) + TX (`build_aes67_output` / `run_aes67_output`) sit
        # behind `#[cfg(feature = "aes67")]` NESTED in `#[cfg(feature = "ffmpeg")]`
        # in `pipeline.rs`, so — exactly like the webrtc-native steps above — the
        # libav-free `feature-clippy` matrix physically cannot build them
        # (ffmpeg-sys-next's build.rs needs libav) and a clippy break in that
        # wiring would reach main CI-green. This leg closes that false-green gap,
        # reusing the SAME pinned FFmpeg env already set up above. --locked (rule
        # 33), -D warnings mirrors the default `lint` gate, --all-targets also
        # lints the aes67 test binaries.
        run: >
          cargo clippy
          --locked
          -p multiview-cli
          --features ffmpeg,aes67
          --all-targets
          -- -D warnings
      - name: clippy + test multiview-cli --features rist
        # The RIST push wiring (`build_rist_push`) sits behind
        # `#[cfg(feature = "rist")]`, and `rist` implies `ffmpeg`, so the
        # libav-free `feature-clippy` matrix cannot build it. Every shipped
        # preset (`nvidia`, `linux-vaapi`, `apple`) enables `rist`, yet no PR
        # leg compiled it: a missing field in that initializer reached main
        # CI-green on 2026-11-09 and broke every `docker` image build and the
        # macOS `apple` preset until 2026-11-11. This leg compiles and tests
        # the feature against the SAME pinned FFmpeg env set up above.
        run: |
          cargo clippy --locked -p multiview-cli --features rist --all-targets -- -D warnings
          cargo test --locked -p multiview-cli --features rist --lib rist_
      - name: Assert the pinned-FFmpeg runtime libs all resolve
        # Fail fast BEFORE the test if any pinned-FFmpeg .so has an unresolved
        # runtime dependency on this bare runner — prints the exact missing soname,
        # so a drifted/incomplete apt list above is diagnosed in ONE run rather than
        # cascading one exit-127 at a time (the aes67 test binary loads the same
        # libav* .so, so this is a faithful pre-flight). LD_LIBRARY_PATH (exported by
        # the extract step) points at the FFmpeg prefix so its own inter-lib deps
        # resolve. `ldd`'s OWN failure (unmatched glob, unreadable/invalid ELF, loader
        # error) fails the step too — an empty "not found" list must not false-pass a
        # check that never actually ran.
        run: |
          set -euo pipefail
          if ! out=$(ldd "${FFMPEG_PREFIX}"/lib/libav*.so.* 2>&1); then
            echo "::error::ldd failed to inspect the pinned FFmpeg libs: ${out}"
            exit 1
          fi
          missing=$(printf '%s\n' "${out}" | awk '/not found/{print $1}' | sort -u)
          if [ -n "${missing}" ]; then
            printf 'missing runtime shared libraries:\n%s\n' "${missing}"
            echo "::error::pinned FFmpeg is missing the runtime libs listed above on this runner"
            exit 1
          fi
          echo "OK: all pinned-FFmpeg runtime deps resolve on this runner"
      - name: clippy multiview-audio --features ffmpeg
        # Lint the real libav decode/resample integration and its test targets
        # against the same pinned LGPL FFmpeg build used in production.
        run: cargo clippy --locked -p multiview-audio --features ffmpeg --all-targets -- -D warnings
      - name: test multiview-ffmpeg avio_fetch against the pinned FFmpeg
        # The HTTP fetch regression tests (chunked redirect -> chunked body must
        # fetch; a truncated sized body must not) only mean something when they
        # link the pinned build, carried patches included (ADR-0031 FF-0c). They
        # fail on an unpatched 9.0.2, so this step enforces the carried patch.
        timeout-minutes: 10
        run: cargo test --locked -p multiview-ffmpeg --features ffmpeg --lib avio_fetch
      - name: test multiview-ffmpeg + multiview-output against the pinned FFmpeg
        # #215: the full ffmpeg-feature suites of the libav-owning crates (caption
        # decoders, bitstream filters, containers, HLS live sink) on the exact
        # pinned build. Before this, they ran nowhere in CI and 15 tests had
        # silently failed for weeks because components were missing from the
        # --disable-everything allowlist.
        timeout-minutes: 20
        run: >
          cargo test --locked --no-fail-fast
          -p multiview-ffmpeg -p multiview-output
          --features multiview-ffmpeg/ffmpeg,multiview-output/ffmpeg
      - name: test multiview-audio --features ffmpeg
        # Committed MOV/pcm_s16le fixtures need only the pinned build's demuxer
        # and decoder: no second system FFmpeg CLI or unavailable WAV demuxer.
        run: cargo test --locked -p multiview-audio --features ffmpeg
      - name: test multiview-cli --features ffmpeg,aes67 (aes67 lib tests)
        # Runs the aes67 cli lib unit tests (RX resolve/plan + non-48kHz reject,
        # TX build + zero-ptime reject, stable ssrc + same-group collision reject,
        # payload-type/program-audio guards, audio-block framing, and the
        # audio-store-not-video-tile + cell-binding RED guardrails) on the real
        # ffmpeg-linked build — these `#[cfg(feature = "aes67")]` tests never execute
        # on the libav-free matrix, so without this step the aes67 regressions are
        # compiled but never run. The FFmpeg runtime libs installed above (VAAPI +
        # opus/srt/oneVPL) let the ffmpeg-linked test binary LOAD (else exit 127),
        # and the guard step above proves that on every run. `--lib aes67` filters to
        # the lib target's aes67-named tests; --locked enforces Cargo.lock — cargo ignores it otherwise.
        timeout-minutes: 10
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,aes67
          --lib aes67
      - name: test multiview-cli --features ffmpeg,aes67 (audio lib tests)
        id: audio-lib-tests
        # The ffmpeg-linked `audio`-module lib unit tests (route-seam crossfade +
        # mailbox backpressure, player/vamp-window looping, shared-URL fetcher wait,
        # loudness telemetry on real decoded audio) never ran in CI before this step:
        # the only ffmpeg,aes67 leg filtered to `--lib aes67`, so this whole module was
        # compiled-but-never-executed on the real libav build. Deliberately NOT the
        # full `multiview-cli` ffmpeg suite — issue #163 records `streaming_encode`
        # hanging there; `--lib audio` stays scoped to this module only.
        timeout-minutes: 10
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,aes67
          --lib audio
      - name: test multiview-cli --features ffmpeg,aes67 (output routing lib tests)
        # ADR-0108 output routing (the take state machine, live encoders, the
        # routing-aux thread and the routed-layout compose) lives behind
        # `ffmpeg`, so its chaos tests (take floods, wedged/panicking aux,
        # held layout canvases, aux-canvas admission) and the end-to-end
        # pipeline takes never ran in CI. Scoped to the three routing modules,
        # NOT the full ffmpeg suite (issue #163). `--test-threads=2`: the
        # router tests sleep per tick to let live workers encode; on a loaded
        # runner full parallelism starves them into `EncoderNotReady`.
        if: ${{ success() || steps.audio-lib-tests.outcome == 'failure' }}
        timeout-minutes: 15
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,aes67
          --lib
          --
          output_routing routing_aux aux_layout
          --test-threads=2
      - name: test multiview-cli --features ffmpeg,aes67 (hls_fetch lib tests)
        # Same gap as the audio step above, for the `hls_fetch`-module lib unit
        # tests (live/VOD playlist parsing, byte-range scheduling, 403/429 backoff,
        # gzip decoding, dispatch/retirement lifecycle fencing). Deliberately scoped
        # to `--lib hls_fetch` only — NOT the full ffmpeg suite (issue #163:
        # `streaming_encode` hangs there). Independent of the audio step, so it
        # runs (and reports) even when that step fails; the job still fails.
        if: ${{ success() || steps.audio-lib-tests.outcome == 'failure' }}
        timeout-minutes: 10
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,aes67
          --lib hls_fetch
      - name: clippy multiview-cli --features ffmpeg,srt-libsrt
        # Dual-stack SRT listener leaf (ADR-0039 decision 10, amended): off by
        # default, NOT implied by plain `ffmpeg`, so — exactly like
        # `webrtc-native`/`aes67` above — the libav-free `feature-clippy` matrix
        # physically cannot build it (links libav AND the native-but-dlopen-only
        # `multiview-srt-sys` leaf) and a clippy break here would reach main
        # CI-green. --locked enforces Cargo.lock; -D warnings mirrors the
        # default `lint` gate; --all-targets also lints the srt test binaries.
        run: >
          cargo clippy
          --locked
          -p multiview-cli
          --features ffmpeg,srt-libsrt
          --all-targets
          -- -D warnings
      - name: clippy multiview-output --features ffmpeg,srt-libsrt
        # The listener-mode push sink (`sink::push::listener_main` et al.) lives
        # entirely behind `srt-libsrt`; same rationale as the cli leg above.
        run: >
          cargo clippy
          --locked
          -p multiview-output
          --features ffmpeg,srt-libsrt
          --all-targets
          -- -D warnings
      - name: test multiview-output --features ffmpeg,srt-libsrt (SRT push, real libsrt loopback)
        # push_resilient_srt.rs drives REAL libsrt caller/listener peers (the
        # apt `ffmpeg` CLI installed above) over loopback: sequential/simultaneous
        # callers, caller-mode reconnect, the never-block drop policy, bounded
        # teardown while blocked in `srt_accept`, and passphrase rejection.
        # `--test-threads=1`: the tests share a per-process port-allocation
        # counter and bind real sockets — serialized avoids port collisions.
        # `required-features` is not set on this target (matches the crate's
        # existing `#![cfg(feature = ...)]`-gated test convention), so this
        # `--features` selection is what makes the file compile at all.
        run: >
          cargo test
          --locked
          -p multiview-output
          --features ffmpeg,srt-libsrt
          --test push_resilient_srt
          --
          --test-threads=1
      - name: test multiview-srt-sys (dual-stack bind + missing-library)
        # The leaf's own suite: libsrt URL/option parsing, the v4-mapped-v6
        # sockaddr round-trip, the missing-library fail-closed path (an
        # injected, deliberately-unresolvable SONAME list), and the real
        # `[::]` dual-stack bind accepting both an IPv6 and an IPv4 `ffmpeg`
        # CLI caller. `--test-threads=1`: the dual-stack test binds a real
        # port.
        run: cargo test --locked -p multiview-srt-sys -- --test-threads=1
      - name: test multiview-cli --features ffmpeg,srt-libsrt (srt listener wiring, pure)
        # `srt_wiring_tests` covers the pure URL-resolution fail-closed/pass-
        # through logic (no sockets). A single cargo invocation that also
        # selected `--test push_pipeline` would apply this SAME name filter to
        # that binary too (cargo's positional TESTNAME is shared across every
        # selected target) and silently run zero of its tests, so it is its
        # own step below instead.
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,srt-libsrt
          --lib srt_wiring
      - name: test multiview-cli --features ffmpeg,srt-libsrt (srt listener pipeline, real libsrt)
        # The two `tests/push_pipeline.rs` SRT tests drive the REAL multiview
        # pipeline end-to-end over a `[::]` listener with the apt `ffmpeg` CLI
        # as the caller/peer. `--test-threads=1` avoids port collisions.
        run: >
          cargo test
          --locked
          -p multiview-cli
          --features ffmpeg,srt-libsrt
          --test push_pipeline
          --
          --test-threads=1

  # ── macOS: pinned LGPL FFmpeg (VideoToolbox) + ffmpeg-feature build/tests ────
  # The macOS counterpart of feature-clippy-ffmpeg-webrtc (ADR-0011, ADR-0031).
  # Builds OUR pinned FFmpeg natively with FF_HWACCEL=apple (VideoToolbox +
  # AudioToolbox, LGPL only) through deploy/ffmpeg-build.sh, caches the prefix
  # keyed on the build inputs, then clippies the ffmpeg presets and runs the
  # multiview-ffmpeg suite against it. Homebrew's own `ffmpeg` (GPL, different
  # major) is never used.
  macos-ffmpeg:
    name: macOS pinned-FFmpeg clippy + test
    runs-on: macos-15
    timeout-minutes: 75
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - name: FFmpeg prefix outside the checkout (no `..`; actions/cache rejects it)
        run: echo "FF_PREFIX=${RUNNER_WORKSPACE}/multiview-ffmpeg" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-ffmpeg
      - name: Build tools (LGPL deps only) + fixture ffmpeg CLI
        # Homebrew's `ffmpeg` is a FIXTURE GENERATOR only (lavfi clips the
        # tests shell out for; the pinned --disable-everything build has no
        # lavfi). Nothing links it: the wrapper clears DYLD_LIBRARY_PATH so it
        # never loads the pinned libraries, and the linkage guard below proves
        # the test binaries load OUR prefix.
        run: |
          set -euo pipefail
          brew install pkg-config nasm opus srt gnutls ffmpeg
          shim="${RUNNER_TEMP}/fixture-bin"
          mkdir -p "${shim}"
          printf '#!/bin/sh\nexec env -u DYLD_LIBRARY_PATH "%s" "$@"\n' "$(brew --prefix)/bin/ffmpeg" > "${shim}/ffmpeg"
          chmod 0755 "${shim}/ffmpeg"
          echo "${shim}" >> "$GITHUB_PATH"
      - name: Record build-dep versions (cache key input)
        id: brewdeps
        run: echo "v=$(brew list --versions opus srt gnutls | tr ' \n' '-_')" >> "$GITHUB_OUTPUT"
      - name: Cache pinned FFmpeg prefix
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ${{ env.FF_PREFIX }}
          key: ffmpeg-apple-${{ runner.arch }}-${{ steps.brewdeps.outputs.v }}-${{ hashFiles('deploy/ffmpeg-build.sh', 'deploy/ffmpeg-fetch-source.sh', 'deploy/ffmpeg-signing-key.asc', 'deploy/ffmpeg-patches/**', 'deploy/Dockerfile.ffmpeg', '.github/workflows/ci.yml') }}
      - name: Build pinned FFmpeg (apple profile)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig"
          FF_LICENSE=lgpl FF_HWACCEL=apple TARGETARCH=arm64 \
            FFMPEG_VERSION="$(pin FFMPEG_VERSION)" FFMPEG_SHA256="$(pin FFMPEG_SHA256)" \
            FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)" \
            bash deploy/ffmpeg-build.sh
      - name: Assert LGPL-only, VideoToolbox present, soname 63
        run: |
          set -euo pipefail
          export DYLD_LIBRARY_PATH="${FF_PREFIX}/lib"
          test -e "${FF_PREFIX}/lib/libavcodec.63.dylib"
          "${FF_PREFIX}/bin/ffmpeg" -hide_banner -encoders | grep -q h264_videotoolbox
          if "${FF_PREFIX}/bin/ffmpeg" -hide_banner -buildconf | grep -qE 'enable-gpl|enable-nonfree|libx26[45]'; then
            echo "::error::GPL/nonfree component in the macOS FFmpeg"; exit 1
          fi
          # The script's own post-install IO allowlist check (same as Docker).
          FF_PREFIX="${FF_PREFIX}" bash deploy/ffmpeg-build.sh --assert-features
          {
            echo "PKG_CONFIG_PATH=${FF_PREFIX}/lib/pkgconfig"
            echo "DYLD_LIBRARY_PATH=${FF_PREFIX}/lib"
          } >> "$GITHUB_ENV"
          # The pinned build's ffprobe verifies outputs (invariant #8); the
          # fixture shim keeps `ffmpeg` resolving to the lavfi generator.
          ln -sf "${FF_PREFIX}/bin/ffprobe" "${RUNNER_TEMP}/fixture-bin/ffprobe"
      - name: clippy multiview-cli --features ffmpeg,overlay,gpu
        run: cargo clippy --locked -p multiview-cli --features ffmpeg,overlay,gpu --all-targets -- -D warnings
      - name: clippy multiview-cli --features apple (VideoToolbox code paths)
        run: cargo clippy --locked -p multiview-cli --features apple --all-targets -- -D warnings
      - name: clippy multiview-cli --features webrtc-native
        run: cargo clippy --locked -p multiview-cli --features webrtc-native --all-targets -- -D warnings
      - name: test multiview-ffmpeg --features ffmpeg,videotoolbox
        run: cargo test --locked --no-fail-fast -p multiview-ffmpeg --features ffmpeg,videotoolbox
      - name: Assert the tests linked OUR prefix, not Homebrew's FFmpeg
        # A wrong PKG_CONFIG_PATH silently falls back to any other libav on the
        # pkg-config default path (e.g. Homebrew's GPL ffmpeg). Fail loudly.
        run: |
          set -euo pipefail
          bin="$(ls -t target/debug/deps/multiview_ffmpeg-* | grep -vE '\.(d|rlib|rmeta)$' | head -1)"
          otool -L "$bin" | grep libavformat
          otool -L "$bin" | grep -q "${FF_PREFIX}/lib/libavformat" \
            || { echo "::error::test binary is not linked against ${FF_PREFIX}"; exit 1; }
      - name: Chaos — bounded exit after a fatal output fault and SIGTERM (#309)
        # Mandatory chaos test for the invariant-#1 exit bound: the REAL binary
        # (with the env-armed `_chaos-test-seams`) is forced behind the clock
        # (fatal) and SIGTERMed, with source teardown held 10x past the bound.
        # Every run: the watchdog fires 2 s after the decision (its own clock),
        # late only by its reported wake latency, and the process is gone
        # within 550 ms of the fire, with valid HLS on disk
        # (docs/architecture/bounded-exit.md). This shared VM has woken a
        # watchdog wait 92 and 106 ms late (one long wait) and, with 20 ms
        # waits, 121-156 ms late in every run of two 40-run series, so its
        # wake-latency bound is 200 ms (50 ms on a dedicated host).
        env:
          CHAOS_MAX_WAKE_LATE_MS: "200"
        run: |
          set -euo pipefail
          cargo build --locked --release -p multiview-cli --features apple,_chaos-test-seams
          bash scripts/chaos-bounded-exit.sh target/release/multiview 10 both
      - name: Release bundle check (apple preset, deploy/macos-bundle.sh, ad-hoc signed)
        # The release workflow only runs on tags; this proves on every PR that
        # the apple binary bundles into a self-contained, signed directory that
        # starts with no DYLD_* override (what release.yml ships).
        run: |
          set -euo pipefail
          cargo build --locked -p multiview-cli --features apple
          stage="${RUNNER_TEMP}/bundle"
          rm -rf "${stage}" && mkdir -p "${stage}"
          cp target/debug/multiview "${stage}/multiview"
          env -u DYLD_LIBRARY_PATH bash deploy/macos-bundle.sh "${stage}" -
          ls "${stage}/lib" "${stage}/licenses"

  # ── Windows: pinned LGPL FFmpeg (MSVC) + workspace check + libav suite ─────────
  # ADR-0011 amendment. Builds OUR pinned FFmpeg with FF_HWACCEL=windows via
  # deploy/ffmpeg-build.sh from MSYS2 inside the MSVC environment (deps from
  # vcpkg), caches the prefix on the build inputs, then checks the workspace and
  # runs the multiview-ffmpeg suite against it. No third-party Windows FFmpeg.
  windows-ffmpeg:
    name: Windows pinned-FFmpeg check + test
    runs-on: windows-2022
    timeout-minutes: 120
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    env:
      VCPKG_ROOT: C:\vcpkg
      FF_WIN_DEPS_WIN: C:\vcpkg\installed\x64-windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-ffmpeg
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils pkgconf nasm patch tar xz gnupg git
      # Before msvc-dev-cmd: it repoints VCPKG_ROOT at the Visual Studio-bundled
      # vcpkg, which has no classic mode. Use the runner's C:\vcpkg explicitly.
      - name: "vcpkg deps (permissive only: opus BSD, libsrt MPL-2.0 + OpenSSL Apache-2.0, zlib)"
        run: |
          $env:VCPKG_ROOT = 'C:\vcpkg'
          & 'C:\vcpkg\vcpkg.exe' install --classic --triplet x64-windows opus libsrt zlib
      - uses: ilammy/msvc-dev-cmd@v1
      - name: FFmpeg prefix outside the checkout (no `..`; actions/cache rejects it)
        run: '"FF_PREFIX_WIN=$env:RUNNER_WORKSPACE\multiview-ffmpeg" | Out-File -Append $env:GITHUB_ENV'
      - name: Cache pinned FFmpeg prefix
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ${{ env.FF_PREFIX_WIN }}
          key: ffmpeg-windows-${{ hashFiles('deploy/ffmpeg-build.sh', 'deploy/ffmpeg-fetch-source.sh', 'deploy/ffmpeg-patches/**', 'deploy/Dockerfile.ffmpeg', '.github/workflows/ci.yml') }}
      - name: Build pinned FFmpeg (windows profile)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pin() { sed -n "s/^ARG $1=//p" deploy/Dockerfile.ffmpeg | head -1; }
          deps="$(cygpath -u "$FF_WIN_DEPS_WIN")"
          export PKG_CONFIG_PATH="$deps/lib/pkgconfig" FF_WIN_DEPS="$deps"
          export INCLUDE="$FF_WIN_DEPS_WIN\include;$INCLUDE" LIB="$FF_WIN_DEPS_WIN\lib;$LIB"
          FF_PREFIX="$(cygpath -u "$RUNNER_WORKSPACE")/multiview-ffmpeg" FF_LICENSE=lgpl FF_HWACCEL=windows TARGETARCH=amd64 \
            FFMPEG_VERSION="$(pin FFMPEG_VERSION)" FFMPEG_SHA256="$(pin FFMPEG_SHA256)" \
            FFMPEG_GIT_COMMIT="$(pin FFMPEG_GIT_COMMIT)" bash deploy/ffmpeg-build.sh
      - name: Re-assert the IO allowlist (cache hits included)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          FF_PREFIX="$(cygpath -u "$RUNNER_WORKSPACE")/multiview-ffmpeg" FF_HWACCEL=windows \
            FF_WIN_DEPS="$(cygpath -u "$FF_WIN_DEPS_WIN")" bash deploy/ffmpeg-build.sh --assert-features
      - name: Assert LGPL-only, NVENC/D3D11VA present, soname 63; export env
        run: |
          $prefix = "$env:RUNNER_WORKSPACE\multiview-ffmpeg"
          $env:PATH = "$prefix\bin;$env:FF_WIN_DEPS_WIN\bin;$env:PATH"
          if (-not (Test-Path "$prefix\bin\avcodec-63.dll")) { throw "avcodec-63.dll missing" }
          if (-not (ffmpeg -hide_banner -encoders | Select-String "h264_nvenc")) { throw "h264_nvenc missing" }
          if (ffmpeg -hide_banner -buildconf | Select-String "enable-gpl|enable-nonfree|libx26") { throw "GPL/nonfree component in the Windows FFmpeg" }
          # ffmpeg-sys-next on MSVC links from FFMPEG_DIR (import libs in lib/);
          # bindgen needs libclang (LLVM is preinstalled on windows-2022).
          "FFMPEG_DIR=$prefix" | Out-File -Append $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -Append $env:GITHUB_ENV
          "$prefix\bin" | Out-File -Append $env:GITHUB_PATH
          "$env:FF_WIN_DEPS_WIN\bin" | Out-File -Append $env:GITHUB_PATH
      - name: cargo check --workspace
        run: cargo check --locked --workspace
      - name: clippy multiview-ffmpeg --features ffmpeg
        run: cargo clippy --locked -p multiview-ffmpeg --features ffmpeg --all-targets -- -D warnings
      - name: test multiview-ffmpeg --features ffmpeg (codec selection + NVENC fallback)
        run: cargo test --locked -p multiview-ffmpeg --features ffmpeg --test codec_select

  # ── AsyncAPI 3.0 spec validation (SUR-6b follow-on, folded into IN-7) ────────
  # Validates docs/api/asyncapi.json against the AsyncAPI 3.0 JSON Schema using
  # the official @asyncapi/cli. The spec is generated by `cargo xtask gen-asyncapi`
  # and committed; this job fails if the committed file is not valid AsyncAPI 3.0.
  # The job does NOT re-generate the spec (that needs the full Rust build); it
  # validates the already-committed artifact (schema-conformance). The companion
  # `spec-freshness` job below regenerates BOTH specs and fails on any git diff, so
  # the committed artifact validated here is also guaranteed up to date.
  asyncapi-validate:
    name: AsyncAPI 3.0 spec validation
    runs-on: ubuntu-latest
    # Node setup + global @asyncapi/cli install + a single validate (~1min).
    timeout-minutes: 15
    needs: changes
    # A docs/api/** spec change keeps `code == 'true'` (the spec is NOT in the
    # prose allowlist), so this validation always runs whenever a spec moves.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: install @asyncapi/cli
        # Pin to a specific version for reproducibility; asyncapi/cli 2.x supports
        # AsyncAPI 3.0. Install globally so `asyncapi` is on PATH.
        run: npm install --global @asyncapi/cli@2.17.0
      - name: validate asyncapi.json
        run: asyncapi validate docs/api/asyncapi.json

  # ── OpenAPI/AsyncAPI spec freshness (drift gate, ADR-RT006) ──────────────────
  # The committed specs `docs/api/{openapi,asyncapi}.json` are generated from the
  # Rust source of truth: openapi.json from `multiview-control`'s utoipa
  # annotations, asyncapi.json from `multiview-events::asyncapi` — both via
  # `cargo xtask gen-{openapi,asyncapi}`. Nothing forced a regen when those
  # annotations changed, so the specs drifted behind the served document (e.g. the
  # ADR-W024 boot-model endpoints `/config/{boot-model,promote,revert-to-start}`
  # landed in the utoipa surface without a spec regen). ADR-RT006's Decision is
  # explicit: "CI regenerates OpenAPI/AsyncAPI ... and fails on any git diff."
  #
  # This job regenerates both specs and `git diff --exit-code docs/api/` — failing
  # if the committed artifacts differ from a fresh generation of the current Rust
  # sources. It mirrors the `i18n-catalogs` freshness pattern (regenerate → diff).
  # The generators are deterministic (re-running is byte-identical), so a green
  # main stays green. Pure-Rust default features (no FFmpeg/GPU) — xtask depends on
  # `multiview-control` + `multiview-events`, both of which build on the bare
  # runner, so no native libs are needed.
  spec-freshness:
    name: OpenAPI/AsyncAPI spec freshness
    runs-on: ubuntu-latest
    # Toolchain + an xtask build (multiview-control's utoipa graph from cold is the
    # long pole) + two quick gen runs + a diff. 30min covers a cold cargo cache
    # while still failing a wedged runner far under the 6h default.
    timeout-minutes: 30
    needs: changes
    # A docs/api/** spec change keeps `code == 'true'` (the specs are NOT in the
    # prose allowlist), and any Rust change to the annotations is code too, so this
    # freshness check runs whenever either side could move.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key — this leg builds xtask + the control/events spec
          # graph, not the default workspace check/test graph.
          key: spec-freshness
      - name: regenerate OpenAPI spec
        # --locked enforces the committed Cargo.lock for a deterministic build
        # (cargo ignores it otherwise), matching the discipline of every other cargo invocation here.
        run: cargo run --locked -p xtask -- gen-openapi
      - name: regenerate AsyncAPI spec
        run: cargo run --locked -p xtask -- gen-asyncapi
      - name: specs are fresh (no uncommitted drift)
        # Fail if either committed spec differs from a fresh regeneration of the
        # current Rust sources. The fix is local: run `cargo xtask gen-openapi &&
        # cargo xtask gen-asyncapi` and commit docs/api/{openapi,asyncapi}.json.
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/api/; then
            echo "::error::API specs are stale. Run 'cargo run -p xtask -- gen-openapi && cargo run -p xtask -- gen-asyncapi' and commit docs/api/{openapi,asyncapi}.json."
            exit 1
          fi

  deny:
    name: cargo-deny (licenses + advisories)
    runs-on: ubuntu-latest
    # `cargo deny check` is ~30s, but the leg also installs a toolchain and the
    # cargo-deny binary (taiki-e/install-action) — 20min covers a cold install.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      # Run cargo-deny on the runner — the action's musl Docker image cannot
      # honour rust-toolchain.toml's pinned toolchain. Default features only:
      # this is the LGPL-clean build; --all-features would pull the opt-in
      # gpl-codecs (GPL) and fail the license allowlist by design.
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The opt-in WebRTC native closure (str0m ICE/DTLS/SRTP + its crypto
      # backend, reqwest, the ffmpeg bindings) handles DTLS secret key material,
      # so its advisories and licenses are gated too (#127). Resolution only —
      # no compile, so no FFmpeg/system libs are needed. Do NOT widen this to
      # --all-features: that pulls the opt-in GPL codecs by design.
      - name: cargo deny (webrtc-native closure)
        run: cargo deny --features multiview-cli/webrtc-native check
      # The ACME closure (instant-acme, hickory, x509-parser) ships in every
      # preset since slice 5 PR B (#291): gate its advisories and licenses too.
      - name: cargo deny (acme closure)
        run: cargo deny --features multiview-cli/acme check

  # ── HTTP/3 front-door fuzzing (#288) ─────────────────────────────────────────
  # The multiview-h3 header-block guard, capsule parser and the real h3 server
  # request path (in-memory transport) under libFuzzer, 30 s per target. The
  # fuzz crate is its own workspace (excluded from the main one); cargo-fuzz
  # needs nightly for the sanitizer flags, so only this job uses nightly.
  fuzz-h3:
    name: fuzz multiview-h3 (30 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-h3
          workspaces: crates/multiview-h3/fuzz
      - name: run fuzz targets
        working-directory: crates/multiview-h3
        run: |
          set -euo pipefail
          for target in header_guard capsule h3_request; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=30
          done

  # ── release-artifact feature guard (task #109) ───────────────────────────────
  # A test-only Cargo feature (multiview-control's `_test-seams`, the config-watch
  # test-interpose seam) must NEVER compile into a shipped/release artifact.
  # `cargo deny` cannot gate a feature and there is no reliable "release" cfg, so
  # this leg RESOLVES each shipped release preset's feature graph with `cargo tree`
  # (resolution only — never a target compile) and fails if any preset enables a
  # `*test-seam*` feature on any crate. See docs/runbooks/release-feature-guard.md.
  release-feature-guard:
    name: release-feature guard (no shipped _test-seams)
    runs-on: ubuntu-latest
    # Building `xtask` (the multiview-control/utoipa graph is the long pole, like
    # spec-freshness) dominates; the `cargo tree` resolutions themselves compile
    # nothing. 30min covers a cold cargo cache while failing a wedged runner far
    # under the 6h default.
    timeout-minutes: 30
    needs: changes
    # A preset / feature change lives in a Cargo.toml (never in the prose
    # allowlist), so `code == 'true'` whenever a preset or the guard could move.
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache key — this leg builds xtask + the control feature graph,
          # not the default workspace check/test graph.
          key: release-feature-guard
      - name: no shipped release preset enables a test-only seam feature
        # Resolves nvidia/apple/linux-vaapi/full + the Docker CARGO_FEATURES combos
        # and fails (exit 1) if any resolves multiview-control/_test-seams (or any
        # `*test-seam*` feature). Fix: remove the feature edge that pulls the seam
        # into a release preset. --locked pins the committed Cargo.lock — cargo ignores it otherwise.
        run: cargo run --locked -p xtask -- check-release-features

  # ── always-run light jobs ────────────────────────────────────────────────
  # These run on every admitted push and PR — including PRs that skip the heavy
  # matrix above — so a prose-docs PR still gets a real green signal (and stays
  # safe as a required check if branch protection is later added). They are
  # intentionally NOT gated on `changes`.
  inclusive-language:
    name: inclusive language
    runs-on: ubuntu-latest
    # Checkout + a single grep-based shell script (seconds).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-inclusive-language.sh

  docs-sanity:
    name: docs link sanity
    runs-on: ubuntu-latest
    # Checkout + a dependency-free markdown link-check script (seconds).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: check relative markdown links resolve
        # Lightweight, dependency-free link check: for every committed Markdown
        # file, resolve each inline relative link target [..](path) against the
        # repo and fail if a referenced file/dir is missing. Skips external
        # (http/https/mailto/tel), in-page anchors (#…), and template/example
        # placeholders. Catches the common docs-PR breakage (renamed/moved brief
        # or ADR) without pulling a Node/Ruby link-checker toolchain.
        run: ./scripts/check-markdown-links.sh

  # Blast-radius classification (docs/standards/engineering.md Part B). Prints the
  # class this PR owes gates for, so the class is visible on the PR rather than
  # asserted in its body. Also shellchecks the classifier itself.
  #
  # ADDITIVE and ADVISORY: this job reports, it never fails a build on the class.
  # It does NOT replace or gate the `changes` job above — `changes` decides which
  # CI jobs run; this decides which human/agent gates the change owes. The two
  # share one prose allowlist (ADR-0046) deliberately so they cannot disagree.
  # Not gated on `changes`: it is seconds long and a docs-only PR still has a class.
  classify:
    name: change class
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The classifier diffs against the merge base, so it needs real history.
          fetch-depth: 0
      - name: shellcheck the classifier
        # The Ubuntu runner ships shellcheck (same pattern as soak-harness below).
        run: shellcheck scripts/classify.sh
      - name: classify the change
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF}" ]; then
            git fetch --no-tags --depth=0 origin "${GITHUB_BASE_REF}" || true
            ./scripts/classify.sh "${BASE_REF}" | tee "${GITHUB_STEP_SUMMARY}"
          else
            # push to main: classify the pushed commit against its parent.
            ./scripts/classify.sh "HEAD~1" | tee "${GITHUB_STEP_SUMMARY}"
          fi

  soak-harness:
    name: soak harness self-test (DEV-C4)
    runs-on: ubuntu-latest
    # shellcheck (seconds) + a `cargo run -p xtask` build for the --dry-run leg.
    # The toolchain + xtask build dominate; 20min covers a cold cache.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: shellcheck the acceptance-soak harness
        # The Ubuntu runner ships shellcheck; lint the harness so a quoting/word-
        # split bug in the real-run scrape/skew path is caught (ADR-R012).
        run: shellcheck scripts/soak-acceptance.sh
      - name: soak harness --dry-run (analyzer wiring, no hardware)
        # Feeds bundled fixtures through `cargo xtask soak-report` and asserts a
        # clean capture PASSes while a single-node offset breach, a CROSS-NODE
        # SKEW breach, and a cadence stall each FAIL — the CI-exercised proof that
        # the harness→analyzer wiring gates a de-synced/stalled deployment.
        run: ./scripts/soak-acceptance.sh --dry-run

  # ── web SPA gates (eslint + tsc + vitest + build) ────────────────────────────
  # Gates the EXISTING web/ scripts (web/package.json): `lint` (eslint
  # --max-warnings=0), an explicit `tsc --noEmit` typecheck, `test` (vitest run),
  # and `build` (lingui compile && tsc --noEmit && vite build). `npm ci` honours
  # the committed web/package-lock.json (deterministic builds), and the
  # built-in setup-node npm cache (keyed on the lockfile) keeps the install fast.
  # tsc is run as its own step (ahead of the heavier build) so a type error
  # reports as a distinct, early failure even though `build` also runs tsc.
  web:
    name: web (eslint + tsc + vitest + build)
    runs-on: ubuntu-latest
    # npm ci + eslint + tsc + vitest + Vite production build (~2-6min). 20min
    # absorbs a cold npm cache and a slow registry while still failing a wedge
    # well under 6h.
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: lint (eslint)
        working-directory: web
        run: npm run lint
      - name: typecheck (tsc --noEmit)
        working-directory: web
        run: npx tsc --noEmit
      - name: test (vitest)
        working-directory: web
        run: npm test
      - name: build
        working-directory: web
        run: npm run build

  # ── embedded UI serving (ADR-0107 slice 6, #292) ─────────────────────────────
  # The engine serves the UI itself on TCP 443 (nginx removed): hashed assets
  # immutable, index no-cache, strong ETag + 304, gzip, 404 for a stale chunk.
  # Those tests need the real `web/dist` (embed-web inlines it at compile
  # time), so this job builds the UI first. No other job compiles embed-web.
  embed-web:
    name: embedded UI serving (multiview-control --features embed-web)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build the UI (web/dist)
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: embed-web
      - name: test the embedded UI serving
        run: >
          cargo test --locked -p multiview-control --features embed-web
          --test embed_web --lib spa

  # ── web Playwright end-to-end (real browser) ─────────────────────────────────
  # Drives the REAL built SPA in a real Chromium (the failure class these specs
  # guard — e.g. the ResourceTable re-render-loop renderer OOM — only reproduces
  # with real browser effects jsdom does not implement; see web/playwright.config.ts).
  # The Playwright webServer builds the app and serves `dist` via `vite preview`,
  # mocking the API per-test (page.route), so no backend is required. The runner's
  # auto-set CI=true makes the config enforce forbidOnly + no server reuse. This is
  # a separate (heavier: chromium download + browser run) job so it parallelises
  # with the lint/tsc/vitest/build job above and stays legible.
  web-e2e:
    name: web e2e (Playwright)
    runs-on: ubuntu-latest
    # npm ci + chromium download (~110MB) + a build + 11 browser specs (~1-3min
    # warm). 25min absorbs a cold npm + browser cache and the in-webServer build.
    timeout-minutes: 25
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: install Playwright chromium
        # --with-deps pulls the OS libraries Chromium needs on the ubuntu runner;
        # the config launches with --no-sandbox for the containerised browser.
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: e2e (playwright)
        # The webServer block builds the SPA and serves it; the specs mock the API.
        working-directory: web
        run: npm run test:e2e

  # ── i18n catalog freshness (lingui extract + compile must be committed) ──────
  # The production `vite build` lingui macro STRIPS the source-string fallback, so
  # any `<Trans>`/`t` string NOT present in the compiled catalog renders as a
  # content-hash ID *in production only* (dev/test keep the fallback, so vitest +
  # build stay green). The other web gates (eslint/tsc/vitest/build) never run
  # `lingui extract`, so a catalog that drifts behind the source strings ships
  # broken hash IDs with a green CI. This job makes that drift a hard failure: it
  # runs the SAME canonical scripts the app uses (web/package.json `i18n:extract` /
  # `i18n:compile` → lingui.config.ts), with `--clean` so obsolete entries are
  # pruned too, then `git diff --exit-code` on web/src/locales/** — failing if the
  # committed catalogs differ from a fresh extract+compile of the current sources.
  i18n-catalogs:
    name: i18n catalog freshness (lingui)
    runs-on: ubuntu-latest
    # npm ci + a lingui extract + compile over the source tree (~1-2min). 15min
    # absorbs a cold npm cache while still failing a wedge far under 6h.
    timeout-minutes: 15
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install
        working-directory: web
        run: npm ci
      - name: extract message catalogs (lingui extract --clean)
        # The canonical `i18n:extract` script (`lingui extract`) plus `--clean` to
        # also drop obsolete entries — re-scans every `t`/`<Trans>` macro in src/
        # into the per-locale PO catalogs. Any new/changed string surfaces here.
        working-directory: web
        run: npm run i18n:extract -- --clean
      - name: compile message catalogs (lingui compile)
        # The canonical `i18n:compile` script — regenerates the compiled `.ts`
        # catalogs the production build imports (the prod macro strips the source
        # fallback, so these MUST match the `.po` sources).
        working-directory: web
        run: npm run i18n:compile
      - name: catalogs are fresh (no uncommitted drift)
        # Fail if the committed catalogs differ from the fresh extract+compile.
        # The fix is local: run `npm --prefix web run i18n:extract -- --clean &&
        # npm --prefix web run i18n:compile` and commit web/src/locales/**.
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- web/src/locales/; then
            echo "::error::i18n catalogs are stale. Run 'npm --prefix web run i18n:extract -- --clean && npm --prefix web run i18n:compile' and commit web/src/locales/**."
            exit 1
          fi

  # ── standalone Live Feed Exchange engine client (#205/#388) ──────────────────
  # tools/media-crypto and tools/native-exchange-runtime are standalone crates
  # (own [workspace], own Cargo.lock, own target/), so the workspace jobs above
  # never build them. This job gates both with fmt, strict clippy and their
  # tests. The native connected tests generate real HEVC + AAC fixtures with the
  # runner's ffmpeg/ffprobe CLI (a test-time tool only: nothing is linked or
  # vendored, the default workspace build stays LGPL-clean and GPU-free).
  native-exchange:
    name: native exchange client (media-crypto + native-exchange-runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/media-crypto -> target
            tools/native-exchange-runtime -> target
      - name: install ffmpeg (libx265 + aac test fixtures)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: rustfmt
        run: |
          cargo fmt --manifest-path tools/media-crypto/Cargo.toml -- --check
          cargo fmt --manifest-path tools/native-exchange-runtime/Cargo.toml -- --check
      - name: clippy
        run: |
          cargo clippy --locked --manifest-path tools/media-crypto/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path tools/native-exchange-runtime/Cargo.toml --all-targets -- -D warnings
      - name: test media-crypto
        run: cargo test --locked --manifest-path tools/media-crypto/Cargo.toml
      - name: test native-exchange-runtime
        # Wall-clock TLS scenarios with real 5 s epochs: one at a time.
        run: cargo test --locked --manifest-path tools/native-exchange-runtime/Cargo.toml -- --test-threads=1
